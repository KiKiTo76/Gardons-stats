function dangerDuel(cur, m) {
  var us = cur.danger, them = cur.agD, max = Math.max(us, them);
  var row = function (name, v, lead) {
    return '<div class="duel-row' + (lead ? " lead" : "") + '"><span class="nm">' + esc(name) + '</span><div class="track"><div class="fill" style="width:' + (max ? Math.round(v / max * 100) : 0) + '%"></div></div><span class="val">' + fmt1(v) + "</span></div>";
  };
  return "<h2>Danger</h2>" + '<div class="card flat duel">' + row(TEAM_NAME, us, us > them) + row(m ? teamName(m.opponentId) : "Adversaires", them, them > us) + "</div>" +
    '<div class="small muted">Danger : qualité des tirs (critique 2, normal 1,5, raté 1). La barre orange désigne l\'équipe la plus dangereuse.</div>';
}

function liveBlocks(S, key, m) {
  var cmp = key === "2" ? "1" : key === "3" ? "2" : null;
  var cur = tierMetrics(S.T[key]), prev = null;
  if (cmp && tierHasData(S.T[key]) && tierHasData(S.T[cmp])) prev = tierMetrics(S.T[cmp]);
  var pl = cmp ? "T" + cmp : "";
  var legend = cmp ? (prev ? '<div class="small muted"><span class="legend good">Vert</span> mieux qu\'au T' + cmp + ', <span class="legend bad">rouge</span> moins bien. Les valeurs sans couleur sont identiques ou ne se comparent pas.</div>' : '<div class="small muted">Comparaison avec le T' + cmp + " disponible dès que les deux tiers ont des données.</div>") : "";
  return legend + TIER_GROUPS.map(function (gr) {
    return "<h2>" + gr.title + (gr.title === "Attaque" && key !== "all" ? " du tier " + key : "") + "</h2>" + statGrid(gr.specs, cur, prev, pl) + (gr.title === "Attaque adverse" ? dangerDuel(cur, m) : "");
  }).join("") +
    "<h2>Situation</h2>" +
    '<div class="card flat tablewrap"><table><thead><tr><th>Situation</th><th>' + esc(TEAM_NAME) + '</th><th>' + esc(m ? teamName(m.opponentId) : "Adversaires") + '</th></tr></thead><tbody>' +
    SITUATIONS.map(function (x) { var t = S.T[key]; return '<tr><td class="name">' + x.label + "</td><td>" + t.sit[x.k].f + "</td><td>" + t.sit[x.k].a + "</td></tr>"; }).join("") + "</tbody></table></div>";
}

function bilanHtml(S) {
  var ms = PERIODS.map(function (p) { return tierHasData(S.T[p]) ? tierMetrics(S.T[p]) : null; });
  var r6 = function (v) { return Math.round(v * 1e6) / 1e6; };
  var body = TIER_GROUPS.map(function (gr) {
    return '<tr class="grp"><th colspan="4">' + gr.title + "</th></tr>" + gr.specs.map(function (sp) {
      var vals = ms.map(function (m) { return m && m[sp.k] != null ? r6(m[sp.k]) : null; });
      var present = vals.filter(function (v) { return v != null; });
      var best = null, worst = null;
      if (sp.dir && present.length >= 2) {
        var mx = Math.max.apply(null, present), mn = Math.min.apply(null, present);
        if (mx !== mn) { best = sp.dir > 0 ? mx : mn; worst = sp.dir > 0 ? mn : mx; }
      }
      return '<tr><td class="name">' + sp.l + "</td>" + vals.map(function (v) {
        var cls = v != null && v === best ? "better" : v != null && v === worst ? "worse" : "";
        return '<td class="' + cls + '">' + fmtVal(v, sp.kind) + "</td>";
      }).join("") + "</tr>";
    }).join("");
  }).join("");
  return "<h2>Bilan par tier</h2>" +
    '<div class="small muted"><span class="legend good">Vert</span> : le tier où la stat est la meilleure, <span class="legend bad">rouge</span> : le tier où elle est la moins bonne.</div>' +
    '<div class="card flat tablewrap"><table class="bilan"><thead><tr><th>Stat</th><th>T1</th><th>T2</th><th>T3</th></tr></thead><tbody>' + body + "</tbody></table></div>";
}

function weightNote() {
  return '<div class="note">Un tier est une période du match (fin T1, fin T2, fin du match). Pondération des tirs : critique ' + fmt1(SHOT_W.critical) + ", normal " + fmt1(SHOT_W.normal) + ", raté " + fmt1(SHOT_W.missed) + ". Un but compte comme un tir critique, un but encaissé comme un tir adverse critique. " +
    "Gardien : arrêt critique " + fmt1(SAVE_W.critical) + ", arrêt normal " + fmt1(SAVE_W.normal) + ". Un tir adverse raté compte pour l'attaque adverse mais pas pour les stats du gardien.</div>";
}

function tierChips(act, key) {
  return '<div class="chips" role="group" aria-label="Tier">' + PERIODS.map(function (p) {
    return '<button class="chip" data-act="' + act + '" data-v="' + p + '" aria-pressed="' + (key === p) + '">Tier ' + p + "</button>";
  }).join("") + '<button class="chip" data-act="' + act + '" data-v="all" aria-pressed="' + (key === "all") + '">Cumul</button></div>';
}

function goalsRecap(m) {
  var goals = evs(m).filter(function (e) { return e.type === "goal"; }).sort(function (a, b) { return (a.per || 1) - (b.per || 1) || (a.t || 0) - (b.t || 0); });
  var who = function (id) { var p = state.players[id]; return p ? esc(p.num) + " " + esc(p.name) : "?"; };
  var rows = goals.map(function (e, i) {
    var ast = Array.isArray(e.ast) ? e.ast.filter(Boolean) : [];
    var tag = e.sit === "sup" ? " (supériorité)" : e.sit === "inf" ? " (infériorité)" : "";
    return '<div class="item"><span class="pill w">T' + (e.per || 1) + '</span><div class="grow"><div class="title">' + who(e.pid) + esc(tag) + '</div><div class="small muted">' + (ast.length ? "Passes : " + ast.map(who).join(", ") : "Sans passe") + "</div></div></div>";
  }).join("");
  return "<h2>Buts marqués</h2>" + (rows ? '<div class="card flat list">' + rows + "</div>" : emptyState("Aucun but marqué", "Les buts de l'équipe apparaissent ici."));
}

function viewLive(id) {
  var m = state.matches[id];
  if (!m) return '<div class="stack">' + backBar("#saison", "Saison en cours") + emptyState("Match introuvable", "Ce match n'existe plus.") + "</div>";
  m = Object.assign({ id: id }, m);
  var S = liveStats(m);
  if (ui.liveFor !== id) { ui.liveFor = id; ui.liveTier = m.played ? "all" : String(Math.min(m.period || 1, 3)); }
  var key = ui.liveTier;
  var back = state.admin ? backBar("#feuille-" + id, m.played ? "Feuille de match" : "Match live") : backBar("#match-" + id, "Fiche du match");
  var out = '<div class="stack">' + back + "<h1>" + (m.played ? "Résumé du match" : "Stats live") + "</h1>" + boardHtml(m) + periodPill(m) + (m.played ? awardsHtml(m) + bilanHtml(S) : "") + tierChips("livetier", key) + liveBlocks(S, key, m) + (key === "all" ? goalsRecap(m) : "");
  var per = key === "all" ? null : key;
  var base = matchRows(m, per).filter(function (r) {
    return (m.lineup || []).indexOf(r.id) >= 0 && (r.isG ? r.active : ((m.lines && m.lines[r.id]) || r.active));
  });
  var rows = sortTable(applyRowFilters(base), ui.sort.mres);
  out += "<h2>Joueurs</h2>" + filterBar(true) + (rows.length
    ? '<div class="card flat tablewrap"><table><thead><tr>' + th("mres", "num", "Joueur") + th("mres", "g", "B") + th("mres", "a", "A") + th("mres", "shc", "TC") + th("mres", "shn", "TN") + th("mres", "shm", "TR") + th("mres", "danger", "Danger") + th("mres", "pim", "Pun.") + th("mres", "pm", "+/-") + "</tr></thead><tbody>" +
      rows.map(function (r) { return '<tr><td class="name">' + esc(r.num) + " " + esc(r.name) + "</td><td>" + r.g + "</td><td>" + r.a + "</td><td>" + r.shc + "</td><td>" + r.shn + "</td><td>" + r.shm + "</td><td>" + fmt1(r.danger) + "</td><td>" + r.pim + "</td><td>" + pmCell(r) + "</td></tr>"; }).join("") + "</tbody></table></div>"
    : emptyState("Aucun joueur", "Aucun joueur ne correspond au filtre, ou la composition est vide."));
  out += weightNote() + "</div>";
  return out;
}

function periodTag(m) {
  var p = m.period || 1;
  return '<span class="pill w" style="white-space:nowrap">' + (m.played ? "Match terminé" : "Tier " + p) + "</span>";
}

function periodPill(m) {
  return '<div class="row">' + periodTag(m) + "</div>";
}

var PM_W = { normal: { goal: 1, ga: -1 }, sup: { goal: 0, ga: -1 }, inf: { goal: 1, ga: 0 } };
var GK_AWARD_W = { ga: 1.5 };

function lineOrder(m, pid) {
  var p = state.players[pid];
  if (!p) return 99999;
  var frac = (p.num || 0) / 1000;
  if (p.pos === "G") return 2000 + (m.gk && m.gk[pid] === "B" ? 100 : 0) + frac;
  var l = m.lines && m.lines[pid];
  var side = m.sides && m.sides[pid];
  if (!l) return 900 + (p.pos === "D" ? 50 : 0) + frac;
  var inLine;
  if (p.pos === "D") inLine = side === "G" ? 40 : side === "D" ? 50 : 60;
  else if (m.centers && m.centers[l] === pid) inLine = 0;
  else inLine = side === "G" ? 10 : side === "D" ? 20 : 30;
  return parseInt(l, 10) * 100 + inLine + frac;
}

function pmWeight(e, kind) {
  var w = PM_W[e.sit] || PM_W.normal;
  return w[kind];
}

function matchPm(m, per) {
  var pmv = {};
  evs(m).forEach(function (e) {
    if (per && String(e.per) !== String(per)) return;
    var ids = e.type === "goal" ? [e.pid].concat(e.ast || [], e.ice || []) : e.type === "ga" ? (e.ice || []) : null;
    if (!ids) return;
    var w = pmWeight(e, e.type);
    ids.filter(function (x, i) { return x && ids.indexOf(x) === i; }).forEach(function (pid) { pmv[pid] = (pmv[pid] || 0) + w; });
  });
  return pmv;
}

function matchRows(m, per) {
  var pmv = matchPm(m, per);
  var ids = {};
  (m.lineup || []).forEach(function (pid) { ids[pid] = true; });
  evs(m).forEach(function (e) { if (e.pid) ids[e.pid] = true; (e.ast || []).forEach(function (a) { ids[a] = true; }); });
  var rows = Object.keys(ids).filter(function (pid) { return state.players[pid]; }).map(function (pid) {
    var s = playerMatchStats(m, pid, per || null), isG = state.players[pid].pos === "G";
    var pm = pmv[pid] || 0;
    var score = isG ? s.svw - GK_AWARD_W.ga * s.ga : pm;
    return Object.assign({}, s, { line: (m.lines && m.lines[pid]) || "", danger: dangerOf(s.shc, s.shn, s.shm), id: pid, name: playerName(pid), num: state.players[pid].num, pos: state.players[pid].pos, isG: isG, pts: s.g + s.a, pm: pm, score: score, order: lineOrder(m, pid),
      active: !!(s.g || s.a || s.pim || s.hj || s.di || s.shc || s.shn || s.shm || s.sv || s.ga || s.adm || pmv[pid]) });
  });
  return rows;
}

function filterBar(showLine, poss) {
  var P = { all: "Tous", A: "Attaquants", D: "Défenseurs", G: "Gardiens" };
  var chip = function (k, v, label) { return '<button class="chip sm" data-act="tfilter" data-k="' + k + '" data-v="' + v + '" aria-pressed="' + (ui.tf[k] === v) + '">' + label + "</button>"; };
  var out = '<div class="row" style="gap:6px 14px"><div class="chips" role="group" aria-label="Poste">' + (poss || ["all", "A", "D", "G"]).map(function (k) { return chip("pos", k, P[k]); }).join("") + "</div>";
  if (showLine) out += '<div class="chips" role="group" aria-label="Ligne">' + chip("line", "all", "Toutes lignes") + LINES.map(function (l) { return chip("line", l, "L" + l); }).join("") + "</div>";
  return out + "</div>";
}

function applyRowFilters(rows) {
  return rows.filter(function (r) {
    return (ui.tf.pos === "all" || r.pos === ui.tf.pos) && (ui.tf.line === "all" || r.line === ui.tf.line);
  });
}

function pmCell(r) { return r.isG ? "-" : (r.pm > 0 ? "+" : "") + r.pm; }

function matchAwards(m) {
  var rows = matchRows(m).filter(function (r) { return r.active; });
  var sk = rows.filter(function (r) { return !r.isG; }), gk = rows.filter(function (r) { return r.isG && r.sh > 0; });
  var byPts = sk.filter(function (r) { return r.pts > 0; }).sort(function (a, b) { return b.pts - a.pts || b.g - a.g || a.pim - b.pim; });
  var byPm = sk.slice().sort(function (a, b) { return b.pm - a.pm || b.pts - a.pts || a.pim - b.pim; });
  var byGk = gk.sort(function (a, b) { return b.score - a.score || b.sv - a.sv; });
  return { pts: byPts[0] || null, eff: byPm[0] && byPm[0].pm > 0 ? byPm[0] : null, gk: byGk[0] || null };
}

function awardsHtml(m) {
  if (!m.played) return "";
  var A = matchAwards(m);
  if (!A.pts && !A.eff && !A.gk) return "";
  var card = function (title, r, line) {
    return '<div class="hero grow" style="padding:14px"><div class="eyebrow">' + title + "</div><h3>" + (r ? esc(r.num) + " " + esc(r.name) : "-") + '</h3><div class="small">' + (r ? line : "") + "</div></div>";
  };
  var p = A.pts, e = A.eff, g = A.gk;
  return "<h2>Joueurs du match</h2>" + '<div class="row" style="align-items:stretch">' +
    card("Meilleur pointeur", p, p ? p.pts + " pt" + (p.pts > 1 ? "s" : "") + " (" + p.g + " B, " + p.a + " A)" : "") +
    card("Homme du match", e, e ? "+/- " + (e.pm > 0 ? "+" : "") + e.pm + " (" + e.g + " B, " + e.a + " A" + (e.pim ? ", " + e.pim + " min pun." : "") + ")" : "") +
    card("Gardien du match", g, g ? g.sv + " arrêt" + (g.sv > 1 ? "s" : "") + " sur " + g.sh + " tirs, " + g.ga + " but" + (g.ga > 1 ? "s" : "") + " encaissé" + (g.ga > 1 ? "s" : "") : "") + "</div>" +
    '<div class="small muted">Meilleur pointeur : buts + passes, puis plus de buts. Homme du match : meilleur +/- parmi les joueurs de champ, règle officielle de la LNH : +1 sur un but marqué à force égale ou en infériorité, -1 sur un but encaissé à force égale ou en supériorité, rien sur un but marqué en supériorité ni sur un but encaissé en infériorité. Gardien du match : arrêts pondérés - ' + fmt1(GK_AWARD_W.ga) + " x buts encaissés.</div>";
}

ui.rosterSeason = null;
ui.rosterMsg = null;

function rosterSeasonId() {
  if (ui.rosterSeason && state.seasons[ui.rosterSeason]) return ui.rosterSeason;
  var a = activeSeason();
  if (a) return a.id;
  var all = list(state.seasons).sort(function (x, y) { return x.name < y.name ? 1 : -1; });
  return all[0] ? all[0].id : null;
}

function rosterIds(sid) {
  var s = sid && state.seasons[sid];
  if (s && Array.isArray(s.roster)) return s.roster.filter(function (id) { return state.players[id]; });
  return Object.keys(state.players).filter(function (id) { return state.players[id].active !== false; });
}

function rosterPlayers(sid) {
  return rosterIds(sid).map(function (id) { return Object.assign({ id: id }, state.players[id]); });
}

function setRoster(sid, ids) {
  var s = state.seasons[sid];
  if (!s) return;
  var uniq = ids.filter(function (x, i) { return ids.indexOf(x) === i; });
  s.roster = uniq;
  write("seasons", sid, { roster: uniq }, "update");
}

function viewRoster() {
  var seasons = list(state.seasons).sort(function (a, b) { return a.name < b.name ? 1 : -1; });
  if (!seasons.length) {
    return '<div class="stack">' + topbar("Effectif") + emptyState("Aucune saison", "Créez une saison dans les réglages pour composer son effectif.", state.admin ? '<a class="btn primary" href="#reglages">Ouvrir les réglages</a>' : "") + "</div>";
  }
  var sid = rosterSeasonId();
  var s = state.seasons[sid];
  var players = rosterPlayers(sid).sort(byPosThenNum);
  var admin = state.admin;
  var sel = '<div class="field"><label for="ro-season">Saison</label><select class="input" id="ro-season" data-change="rosterSeason">' + seasons.map(function (x) {
    return '<option value="' + x.id + '"' + (x.id === sid ? " selected" : "") + ">" + esc(x.name) + (x.active ? " (en cours)" : "") + "</option>";
  }).join("") + "</select></div>";
  var count = { A: 0, D: 0, G: 0 };
  players.forEach(function (p) { if (count[p.pos] != null) count[p.pos]++; });
  var summary = '<div class="chips"><span class="pill">' + players.length + " joueur" + (players.length > 1 ? "s" : "") + '</span><span class="pill">' + count.A + ' attaquants</span><span class="pill">' + count.D + ' défenseurs</span><span class="pill">' + count.G + " gardien" + (count.G > 1 ? "s" : "") + "</span></div>";
  var groups = [["A", "Attaquants"], ["D", "Défenseurs"], ["G", "Gardiens"]].map(function (g) {
    var rows = players.filter(function (p) { return p.pos === g[0]; });
    if (!rows.length) return "";
    return "<h2>" + g[1] + "</h2>" + '<div class="card flat list">' + rows.map(function (p) {
      if (admin && ui.edit === "players/" + p.id) return editRowPlayer(p);
      return '<div class="item"><span class="jersey">' + esc(p.num) + '</span><div class="grow"><div class="title">' + esc(p.name) + "</div></div>" +
        (admin ? '<button class="btn ghost" data-act="edit" data-k="players/' + p.id + '">Modifier</button><button class="btn ghost danger" data-act="ro-remove" data-id="' + p.id + '">Retirer</button>' : "") + "</div>";
    }).join("") + "</div>";
  }).join("");
  if (!players.length) groups = emptyState("Effectif vide", admin ? "Importez votre liste de joueurs ou ajoutez-les un par un ci-dessous." : "Aucun joueur n'a encore été ajouté à cette saison.");
  var tools = "";
  if (admin) {
    var inRoster = {};
    players.forEach(function (p) { inRoster[p.id] = true; });
    var others = list(state.players).filter(function (p) { return !inRoster[p.id]; }).sort(function (a, b) { return a.name.localeCompare(b.name); });
    var otherSeasons = seasons.filter(function (x) { return x.id !== sid; });
    tools = "<h2>Importer</h2>" +
      '<div class="row"><label class="btn" for="roster-input">Importer une liste (Excel)</label><input type="file" id="roster-input" accept=".xlsx" hidden data-change="rosterxlsx"><span class="small muted grow">Colonnes Nom, Prénom, Numéro et Position. Les joueurs sont ajoutés à l\'effectif de la saison choisie, et créés s\'ils n\'existent pas.</span></div>' +
      (ui.rosterMsg ? '<div class="note">' + ui.rosterMsg + "</div>" : "") +
      "<h2>Ajouter</h2>" +
      '<div class="inline-form"><input class="input" id="add-pname" placeholder="Nom du joueur" autocomplete="off" aria-label="Nom du nouveau joueur"><input class="input" id="add-pnum" type="number" min="0" max="99" placeholder="N°" style="max-width:90px" aria-label="Numéro"><select class="input" id="add-ppos" style="max-width:150px" aria-label="Position">' +
      Object.keys(POS).map(function (k) { return '<option value="' + k + '">' + POS[k] + "</option>"; }).join("") + '</select><button class="btn primary" data-act="addplayer">+ Ajouter</button></div>' +
      (others.length ? '<div class="inline-form"><select class="input" id="ro-add" aria-label="Joueur existant">' + others.map(function (p) { return '<option value="' + p.id + '">' + esc(p.num) + " " + esc(p.name) + "</option>"; }).join("") + '</select><button class="btn dark" data-act="ro-add">Ajouter un joueur connu</button></div>' : "") +
      (otherSeasons.length ? '<div class="inline-form"><select class="input" id="ro-copy" aria-label="Copier depuis une autre saison">' + otherSeasons.map(function (x) { return '<option value="' + x.id + '">' + esc(x.name) + "</option>"; }).join("") + '</select><button class="btn dark" data-act="ro-copy">Copier cet effectif</button></div>' : "");
  }
  return '<div class="stack">' + topbar("Effectif", s ? s.name : "") + sel + summary + groups + tools + "</div>";
}

function importRoster(input) {
  var file = input.files && input.files[0];
  var sid = rosterSeasonId();
  if (!file || !sid) return;
  if (typeof JSZip === "undefined") { ui.rosterMsg = "Le lecteur Excel n'a pas pu se charger. Rechargez la page."; render(); return; }
  file.arrayBuffer().then(readXlsxRows).then(function (rows) {
    var entries = parseComposition(rows);
    if (!entries || !entries.length) { ui.rosterMsg = "Fichier non reconnu. Il faut une ligne d'en-tête avec Nom, Prénom, Numéro et Position."; render(); return; }
    var byName = {};
    Object.keys(state.players).forEach(function (id) { byName[normKey(state.players[id].name)] = id; });
    var ids = rosterIds(sid).slice(), created = 0, known = 0, skipped = [];
    entries.forEach(function (e) {
      var full = (e.prenom + " " + e.nom).trim();
      var id = byName[normKey(e.prenom + " " + e.nom)] || byName[normKey(e.nom + " " + e.prenom)];
      if (id) { known++; ids.push(id); return; }
      var num = e.num != null ? parseInt(e.num, 10) : NaN;
      if (!e.pos || isNaN(num)) { skipped.push(full + (e.pos ? " (numéro manquant)" : " (position inconnue)")); return; }
      id = newId("players");
      var doc = { name: full, num: num, pos: e.pos, active: true };
      state.players[id] = doc;
      write("players", id, doc, "set");
      byName[normKey(full)] = id;
      created++; ids.push(id);
    });
    setRoster(sid, ids);
    var nm = state.seasons[sid].name;
    ui.rosterMsg = esc((created + known) + " joueur" + (created + known > 1 ? "s" : "") + " dans l'effectif " + nm + " (" + created + " créé" + (created > 1 ? "s" : "") + ", " + known + " déjà connu" + (known > 1 ? "s" : "") + ")." + (skipped.length ? " Ignorés : " + skipped.join(", ") + "." : ""));
    input.value = "";
    render();
  }).catch(function () { ui.rosterMsg = "Impossible de lire ce fichier. Utilisez un fichier .xlsx."; render(); });
}

function render() {
  pendingRender = false;
  var r = route();
  if (r.name === "nouveau") { location.replace("#reglages"); r = route(); }
  var lock = state.loaded >= COLLS.length ? liveLockId() : null;
  if (lock && !((r.name === "feuille" || r.name === "live") && r.id === lock)) {
    location.replace("#feuille-" + lock);
    r = route();
  }
  var app = document.getElementById("app");

function scheduleRender() {
  var a = document.activeElement;
  var app = document.getElementById("app");
  if (a && app.contains(a) && (a.tagName === "INPUT" || a.tagName === "SELECT")) { pendingRender = true; return; }
  render();
}

function val(id) { var e = document.getElementById(id); return e ? e.value.trim() : ""; }

function go(hash) { if (location.hash === "#" + hash) render(); else location.hash = hash; }

function addEvent(mid, pid, type, extra) {
  var m = state.matches[mid];
  if (!m) return;
  var e = Object.assign({ id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6), pid: pid || null, type: type, t: Date.now(), per: m.period || 1 }, extra || {});
  if (!Array.isArray(m.events)) m.events = [];
  m.events.push(e);
  write("matches", mid, { events: m.events.slice() }, "update");
  toast(eventText(e));
  render();
}

function holderOf(t) { return t === "nm" ? ui.nm : state.matches[t]; }

function commitCompo(t) {
  var h = holderOf(t);
  if (!h) return;
  var lineup = (h.lineup || []).slice();
  var inL = {};
  lineup.forEach(function (pid) { inL[pid] = true; });
  var lines = Object.assign({}, h.lines || {}), sides = Object.assign({}, h.sides || {}), gk = Object.assign({}, h.gk || {});
  var centers = Object.assign({ "1": "", "2": "", "3": "" }, h.centers || {});
  var cap = Object.assign({ c: "", a1: "", a2: "" }, h.cap || {});
  Object.keys(state.players).forEach(function (pid) {
    if (!inL[pid] || state.players[pid].pos === "G") { lines[pid] = ""; sides[pid] = ""; }
    if (!inL[pid] || state.players[pid].pos !== "G") gk[pid] = "";
  });
  LINES.forEach(function (l) {
    var c = centers[l] || "";
    if (c && !(inL[c] && lines[c] === l && state.players[c] && state.players[c].pos === "A")) c = "";
    centers[l] = c;
    if (c) sides[c] = "";
  });
  ["c", "a1", "a2"].forEach(function (k) {
    var pid = cap[k];
    if (pid && (!inL[pid] || !state.players[pid] || state.players[pid].pos === "G")) cap[k] = "";
  });
  h.lineup = lineup; h.lines = lines; h.sides = sides; h.gk = gk; h.centers = centers; h.cap = cap;
  if (t !== "nm") write("matches", t, { lineup: lineup, lines: lines, sides: sides, gk: gk, centers: centers, cap: cap }, "update");
  render();
}

function setCompo(t, pid, l) {
  var h = holderOf(t);
  if (!h || !state.players[pid]) return;
  var lineup = (h.lineup || []).slice();
  var i = lineup.indexOf(pid);
  h.lines = Object.assign({}, h.lines || {});
  if (l === "0") { if (i >= 0) lineup.splice(i, 1); }
  else { if (i < 0) lineup.push(pid); h.lines[pid] = l; }
  h.lineup = lineup;
  commitCompo(t);
}

function setRole(t, pid, v) {
  var h = holderOf(t), p = state.players[pid];
  if (!h || !p) return;
  var lineup = (h.lineup || []).slice();
  var i = lineup.indexOf(pid);
  h.lines = Object.assign({}, h.lines || {});
  h.sides = Object.assign({}, h.sides || {});
  h.centers = Object.assign({ "1": "", "2": "", "3": "" }, h.centers || {});
  if (v === "0") {
    if (i >= 0) lineup.splice(i, 1);
  } else if (p.pos === "G") {
    if (i < 0) lineup.push(pid);
    h.gk = Object.assign({}, h.gk || {});
    if (v === "T") lineup.forEach(function (o) { if (o !== pid && state.players[o] && state.players[o].pos === "G" && h.gk[o] !== "B") h.gk[o] = "B"; });
    h.gk[pid] = v === "B" ? "B" : "T";
  } else {
    var line = h.lines[pid] || "";
    LINES.forEach(function (l) { if (h.centers[l] === pid && v !== "C") h.centers[l] = ""; });
    if (v === "C") {
      if (!line) { toast("Choisissez d'abord une ligne (L1 à L3)"); render(); return; }
      if (i < 0) lineup.push(pid);
      h.centers[line] = pid;
    } else {
      if (i < 0) lineup.push(pid);
      h.sides[pid] = v === "G" || v === "D" ? v : "";
    }
  }
  h.lineup = lineup;
  commitCompo(t);
}

function setLeader(t, key, pid) {
  var h = holderOf(t);
  if (!h) return;
  var cap = Object.assign({ c: "", a1: "", a2: "" }, h.cap || {});
  ["c", "a1", "a2"].forEach(function (k) { if (k !== key && pid && cap[k] === pid) cap[k] = ""; });
  cap[key] = pid || "";
  h.cap = cap;
  commitCompo(t);
}

function loadFirebase() {

    import(base + "firebase-firestore.js"),

    var appMod = m[0], fs = m[1], au = m[2];
    var app = appMod.initializeApp(FIREBASE_CONFIG);
    var fdb;
    try {
      fdb = fs.initializeFirestore(app, { localCache: fs.persistentLocalCache({ tabManager: fs.persistentMultipleTabManager() }) });

    var auth = au.getAuth(app);
    var db = {

            var ref = id ? fs.doc(fdb, c, id) : fs.doc(fs.collection(fdb, c));

    };

  render();
  var slowTimer = setTimeout(function () { if (state.loaded < COLLS.length) { state.slow = true; render(); } }, 10000);
  if (!FIREBASE_CONFIG.projectId) { state.failed = true; render(); return; }
  loadFirebase().then(function (fb) {
    var db = fb.db;
    state.db = db;
    pending = loadQueue();
    flush();
    document.addEventListener("click", function (e) {
      var r = e.target.closest && e.target.closest(".role");
      if (!r) return;
      if (fb.auth.currentUser) {
        if (!ADMIN_UID) window.prompt("Votre UID (à copier dans ADMIN_UID et firestore.rules)", fb.auth.currentUser.uid);
        else if (window.confirm("Se déconnecter ?")) fb.au.signOut(fb.auth);
      } else login(fb);
    });
    fb.au.onAuthStateChanged(fb.auth, function (u) {
      state.admin = !!(u && ADMIN_UID && u.uid === ADMIN_UID);
      scheduleRender();
      if (u && !ADMIN_UID) toast("Connecté. Touchez le badge Invité pour afficher votre UID.");
    });
    var seen = {};
    COLLS.forEach(function (c) {
      db.collection(c).onSnapshot(function (snap) {
        var map = {};
        snap.docs.forEach(function (d) { map[d.id] = JSON.parse(JSON.stringify(d.data())); });
        state[c] = map;
        overlayPending(c);
        if (!seen[c]) { seen[c] = true; state.loaded++; clearTimeout(slowTimer); state.slow = false; }
        scheduleRender();
      }, function () { state.failed = true; render(); });
    });
  }).catch(function () { state.failed = true; render(); });
}

boot();
if ("serviceWorker" in navigator) window.addEventListener("load", function () { navigator.serviceWorker.register("sw.js").catch(function () {}); });
</script>
</body>
