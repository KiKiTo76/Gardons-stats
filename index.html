<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Gardons">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<title>Stats Hockey</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:ital,wght@0,600;0,700;0,800;1,700;1,800&display=swap">
<style>
:root {
  --bg: #000000;
  --surface: #121214;
  --surface-2: #1d1d20;
  --ink: #f6f6f4;
  --muted: #a3a3aa;
  --line: #2c2c31;
  --navy: #000000;
  --on-navy: #f6f6f4;
  --accent: #ffa300;
  --on-accent: #0a0a0a;
  --good: #52d08f;
  --bad: #ff6b5f;
  --neutral: #8e8e95;
  --display: "Barlow Condensed", "Arial Narrow", sans-serif;
  --body: "Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;
  --nav-h: 64px;
  --side-w: 232px;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.45;
  padding-block: 0;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
h1, h2, h3 { font-family: var(--display); font-weight: 700; margin: 0; text-wrap: balance; letter-spacing: 0.01em; }
h1 { font-size: 2rem; line-height: 1.1; }
h2 { font-size: 1.25rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }
h3 { font-size: 1.15rem; }
a { color: inherit; text-decoration: none; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }

.shell { display: block; min-height: 100vh; }
.side { display: none; }
.tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; display: flex; justify-content: space-around;
  background: var(--navy); color: var(--on-navy);
  padding: 8px max(8px, env(safe-area-inset-right, 0px)) calc(8px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px));
}
.tab { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 2px; border-radius: 10px; font-size: 0.72rem; font-weight: 600; opacity: 0.7; min-width: 0; }
.tab svg { width: 22px; height: 22px; }
.tab[aria-current="page"] { opacity: 1; color: #fff; background: rgba(255,255,255,0.12); }
.main { padding-block: 20px calc(var(--nav-h) + 40px + env(safe-area-inset-bottom, 0px)); max-width: 880px; margin: 0 auto; }
.stack { display: flex; flex-direction: column; gap: 20px; }
.row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.row.between { justify-content: space-between; }
.grow { flex: 1; min-width: 0; }
.muted { color: var(--muted); }
.small { font-size: 0.85rem; }

.topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 4px; }
.eyebrow { font-size: 0.78rem; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
.role { font-size: 0.75rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; padding: 5px 10px; border-radius: 4px; background: var(--navy); color: var(--on-navy); white-space: nowrap; }
.role.guest { background: var(--surface-2); color: var(--muted); }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 16px; }
.card.flat { padding: 0; overflow: hidden; }
.list > * + * { border-top: 1px solid var(--line); }
.item { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 16px; min-width: 0; }
a.item:hover, button.item:hover { background: var(--surface-2); }
button.item { width: 100%; background: none; border: 0; text-align: left; }
.item .title { font-weight: 600; overflow-wrap: anywhere; }

.hero { background: var(--navy); color: var(--on-navy); border-radius: 10px; padding: 20px; position: relative; overflow: hidden; }
.hero::after { content: ""; position: absolute; right: -40px; top: -40px; width: 160px; height: 160px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.14); box-shadow: inset 0 0 0 28px rgba(255,255,255,0.03); }
.hero .eyebrow { color: var(--accent); }
.hero h1 { margin-top: 6px; }

.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(76px, 1fr)); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.stat { padding: 12px 8px; text-align: center; border-right: 1px solid var(--line); }
.stat:last-child { border-right: 0; }
.stat b { display: block; font-family: var(--display); font-size: 1.7rem; line-height: 1.1; }
.stat span { font-size: 0.72rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 10px 18px; border-radius: 6px; border: 1px solid var(--line); background: var(--surface); font-weight: 700; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn.dark { background: var(--navy); border-color: var(--navy); color: var(--on-navy); }
.btn.ghost { background: none; border-color: transparent; color: var(--accent); padding-inline: 8px; }
.btn.danger { color: var(--bad); }
.btn.block { width: 100%; }
.btn[disabled] { opacity: 0.5; cursor: not-allowed; }
.fab { position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(var(--nav-h) + 16px + env(safe-area-inset-bottom, 0px)); z-index: 15; height: 56px; padding-inline: 22px; border-radius: 8px; box-shadow: 0 8px 20px rgba(0,0,0,0.28); }

.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { min-height: 40px; padding: 8px 16px; border-radius: 4px; border: 1px solid var(--line); background: var(--surface); font-weight: 600; }
.chip[aria-pressed="true"] { background: var(--navy); border-color: var(--navy); color: var(--on-navy); }
.pill { font-size: 0.75rem; font-weight: 700; padding: 4px 10px; border-radius: 4px; background: var(--surface-2); color: var(--muted); white-space: nowrap; }
.pill.w { background: color-mix(in srgb, var(--good) 18%, transparent); color: var(--good); }
.pill.l { background: color-mix(in srgb, var(--bad) 16%, transparent); color: var(--bad); }

.score { font-family: var(--display); font-weight: 800; font-size: 1.5rem; white-space: nowrap; }
.score.w { color: var(--good); }
.score.l { color: var(--bad); }
.score.n { color: var(--neutral); }

.board { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 12px; text-align: center; }
.board .team { font-family: var(--display); font-weight: 700; font-size: 1.2rem; overflow-wrap: anywhere; }
.board .big { font-family: var(--display); font-weight: 800; font-size: 3rem; line-height: 1; white-space: nowrap; }

.field { display: flex; flex-direction: column; gap: 6px; }
.field label, .label { font-size: 0.8rem; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }
.input { width: 100%; min-height: 46px; padding: 10px 14px; border-radius: 6px; border: 1px solid var(--line); background: var(--surface); }

.tablewrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; }
th, td { padding: 10px 12px; text-align: center; white-space: nowrap; font-variant-numeric: tabular-nums; }
th { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); border-bottom: 1px solid var(--line); }
th button { background: none; border: 0; font: inherit; text-transform: inherit; letter-spacing: inherit; color: inherit; font-weight: 700; padding: 0; }
th[aria-sort] button { color: var(--accent); }
td:first-child, th:first-child { text-align: left; }
tbody tr + tr td { border-top: 1px solid var(--line); }
td.name { font-weight: 600; text-align: left; }
td.pts { font-weight: 800; }

.stepper { display: inline-flex; align-items: center; gap: 4px; }
.stepper button { width: 44px; height: 44px; border-radius: 6px; border: 1px solid var(--line); background: var(--surface); font-size: 1.4rem; font-weight: 700; line-height: 1; }
.stepper button.plus { background: var(--navy); border-color: var(--navy); color: var(--on-navy); }
.stepper output { min-width: 28px; text-align: center; font-family: var(--display); font-weight: 800; font-size: 1.4rem; }
.pl { display: grid; grid-template-columns: 1fr; gap: 10px; padding: 14px 16px; }
.pl .head { display: flex; align-items: center; gap: 12px; }
.pl .steppers { display: flex; flex-wrap: wrap; gap: 14px 20px; }
.pl .steppers > div { display: flex; flex-direction: column; gap: 4px; }

.jersey { width: 34px; height: 34px; border-radius: 50%; background: var(--navy); color: var(--on-navy); display: inline-flex; align-items: center; justify-content: center; font-family: var(--display); font-weight: 700; flex: none; }
.jersey.off { background: var(--neutral); }
.check { width: 26px; height: 26px; border-radius: 8px; border: 2px solid var(--line); background: var(--surface); flex: none; display: inline-flex; align-items: center; justify-content: center; color: transparent; }
.check.on { background: var(--good); border-color: var(--good); color: #fff; }

.empty { text-align: center; padding: 28px 16px; color: var(--muted); }
.empty b { display: block; color: var(--ink); font-family: var(--display); font-size: 1.3rem; margin-bottom: 4px; }
.note { font-size: 0.85rem; color: var(--muted); background: var(--surface-2); padding: 8px 12px; border-radius: 10px; }
.syncbar { position: fixed; left: 0; right: 0; top: 0; z-index: 70; padding: 8px 14px; text-align: center; font-size: 0.82rem; font-weight: 700; background: var(--surface-2); color: var(--ink); border-bottom: 1px solid var(--line); }
.syncbar.off { background: var(--bad); color: #0a0a0a; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(var(--nav-h) + 84px + env(safe-area-inset-bottom, 0px)); z-index: 60; background: var(--ink); color: var(--bg); padding: 10px 18px; border-radius: 4px; font-weight: 600; max-width: 90vw; }
.back { width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); display: inline-flex; align-items: center; justify-content: center; }
.form { display: flex; flex-direction: column; gap: 16px; }
.inline-form { display: flex; gap: 8px; flex-wrap: wrap; padding: 14px 16px; background: var(--surface-2); }
.inline-form .input { flex: 1; min-width: 120px; }

@media (min-width: 900px) {
  body { padding-left: calc(var(--side-w) + 32px); padding-right: 32px; }
  .tabbar { display: none; }
  .side {
    display: flex; flex-direction: column; gap: 6px; position: fixed; left: 0; top: 0; bottom: 0; width: var(--side-w);
    background: var(--navy); color: var(--on-navy); padding: 24px 14px;
  }
  .side .brand { font-family: var(--display); font-weight: 800; font-size: 1.6rem; padding: 0 10px 18px; letter-spacing: 0.02em; }
  .side .brand small { display: block; font-family: var(--body); font-size: 0.72rem; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; opacity: 0.6; }
  .side .tab { flex-direction: row; gap: 12px; font-size: 1rem; padding: 12px 14px; justify-content: flex-start; flex: none; }
  .main { padding-block: 32px 60px; }
  .fab { right: 32px; bottom: 32px; }
  .toast { bottom: 32px; }
}
@media (max-width: 480px) {
  h1 { font-size: 1.7rem; }
  .board .big { font-size: 2.4rem; }
}
@media (prefers-reduced-motion: no-preference) {
  .btn, .chip, .tab, .stepper button { transition: background-color 0.15s, transform 0.1s; }
  .btn:active, .stepper button:active { transform: scale(0.97); }
}

.chip.sm { min-height: 34px; padding: 4px 12px; font-size: 0.85rem; }
.crow { display: flex; align-items: center; justify-content: space-between; gap: 10px 14px; flex-wrap: wrap; padding: 10px 16px; }
.plgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px; }
.plbtn { display: flex; align-items: center; gap: 10px; min-height: 64px; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); text-align: left; min-width: 0; }
.plbtn:hover { background: var(--surface-2); }
.plbtn .title { font-weight: 700; overflow-wrap: anywhere; }
.badges { display: flex; flex-wrap: wrap; gap: 4px; justify-content: flex-end; max-width: 45%; }
.badge { font-size: 0.7rem; font-weight: 700; padding: 2px 7px; border-radius: 4px; background: var(--surface-2); color: var(--ink); white-space: nowrap; }
.badge.good { background: color-mix(in srgb, var(--good) 20%, transparent); color: var(--good); }
.badge.bad { background: color-mix(in srgb, var(--bad) 18%, transparent); color: var(--bad); }
.sheet-back { position: fixed; inset: 0; z-index: 40; background: rgba(5, 12, 20, 0.55); }
.sheet { position: fixed; z-index: 41; left: 0; right: 0; bottom: 0; margin: 0 auto; max-width: 560px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px 12px 0 0; padding: 18px 16px calc(18px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 16px; max-height: 88vh; overflow-y: auto; }
.actions { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
.abtn { min-height: 64px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface-2); font-weight: 700; font-size: 1.05rem; padding: 10px; }
.abtn.good { background: color-mix(in srgb, var(--good) 22%, var(--surface)); border-color: var(--good); color: var(--good); }
.abtn.bad { background: color-mix(in srgb, var(--bad) 18%, var(--surface)); border-color: var(--bad); color: var(--bad); }

.lineblock { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px; display: flex; flex-direction: column; gap: 12px; }
.frow { display: flex; gap: 10px; }
.frow > .pcard { flex: 1 1 0; min-width: 0; }
.frow.def { justify-content: center; }
.frow.def > .pcard { flex: 0 0 calc((100% - 20px) / 3); }
.pcard { position: relative; display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 12px 6px 10px; min-height: 104px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); text-align: center; }
.pcard:hover { background: var(--surface-2); }
.pcard .title { font-weight: 700; font-size: 0.9rem; line-height: 1.2; overflow-wrap: anywhere; }
.pcard .badges { justify-content: center; max-width: 100%; }
.cbadge { position: absolute; top: -9px; right: -6px; min-width: 22px; height: 22px; padding: 0 6px; border-radius: 4px; background: var(--accent); color: var(--on-accent); font-family: var(--display); font-weight: 800; font-size: 0.75rem; letter-spacing: 0.04em; display: flex; align-items: center; justify-content: center; }
.lbadge { position: absolute; top: -9px; left: -6px; width: 22px; height: 22px; border-radius: 50%; background: var(--navy); color: var(--on-navy); border: 1px solid var(--line); font-family: var(--display); font-weight: 800; font-size: 0.85rem; display: flex; align-items: center; justify-content: center; }
select.input.sm { width: auto; min-height: 34px; padding: 4px 10px; border-radius: 4px; font-size: 0.85rem; font-weight: 600; }

html { background: var(--bg); }
h1 { font-style: italic; text-transform: uppercase; letter-spacing: 0.02em; color: var(--ink); background: linear-gradient(180deg, #ffffff 35%, #b2b2b8 100%); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
h2 { font-size: 1rem; font-style: italic; color: var(--accent); letter-spacing: 0.16em; }
h3 { font-style: italic; }
.score, .stat b, .board .big, .board .team { font-style: italic; }
.topbar .eyebrow { color: var(--accent); }
.role { background: var(--accent); color: var(--on-accent); }
.role.guest { background: var(--surface-2); color: var(--muted); }
.tabbar { border-top: 2px solid var(--accent); }
.tab[aria-current="page"] { color: var(--accent); background: rgba(255, 163, 0, 0.14); }
.side { border-right: 2px solid var(--accent); }
.side .logo { display: block; width: 100%; max-width: 190px; height: auto; margin: 0 auto 18px; }
.logo-sm { width: 78px; height: auto; flex: none; }
.hero { background: linear-gradient(135deg, #1b1b1e 0%, #000000 72%); border: 2px solid var(--accent); }
.hero::after { right: -34px; top: -20px; width: 96px; height: 220%; border: 0; border-radius: 0; box-shadow: none; background: var(--accent); opacity: 0.13; transform: skewX(-20deg); }
.btn.dark { background: var(--surface-2); border-color: var(--accent); color: var(--accent); }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.jersey { background: var(--accent); color: var(--on-accent); border-radius: 6px; }
.jersey.off { background: var(--neutral); color: #0a0a0a; }
.lbadge { background: var(--ink); color: var(--bg); border-color: var(--bg); border-radius: 6px; }
.sheet { border-top: 2px solid var(--accent); }

.lineblock { display: grid; grid-template-columns: 22px 1fr; column-gap: 10px; align-items: stretch; padding: 8px 10px; border-radius: 8px; }
.lineblock > h2 { writing-mode: vertical-rl; transform: rotate(180deg); text-align: center; font-size: 0.8rem; letter-spacing: 0.2em; margin: 0; }
.lrows { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.frow { gap: 8px; }
.pcard { flex-direction: row; justify-content: flex-start; gap: 8px; padding: 6px 8px; min-height: 52px; text-align: left; }
.pcard .jersey { width: 30px; height: 30px; font-size: 0.95rem; }
.pcard .title { font-size: 0.85rem; flex: 1 1 auto; min-width: 0; }
.pcard .badges { justify-content: flex-start; max-width: none; flex: none; }
.cbadge, .lbadge { top: -8px; height: 18px; min-width: 18px; font-size: 0.65rem; }
.lbadge { width: 18px; }
.live { gap: 8px; }
.main:has(.live) { padding-block-start: 10px; }
.live .card > .eyebrow, .live .card > div[style*="margin-top:8px"] { display: none; }
.live .board { margin-top: 0 !important; }
.live .pill { align-self: center; }
.live .card { padding: 8px 14px; }
.live .board .big { font-size: 2rem; }
.live .board .team { font-size: 1rem; }
.live .btn { min-height: 44px; }
.live .plgrid { grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 8px; }
.live .plbtn { min-height: 52px; padding: 6px 10px; }
@media (max-width: 640px) {
  .lineblock { grid-template-columns: 1fr; }
  .lineblock > h2 { writing-mode: horizontal-tb; transform: none; text-align: left; }
  .pcard { flex-direction: column; justify-content: center; text-align: center; gap: 4px; min-height: 84px; }
  .pcard .title { flex: none; }
  .pcard .badges { justify-content: center; }
}
.sheet.wide { max-width: 820px; gap: 10px; padding: 12px 16px calc(12px + env(safe-area-inset-bottom, 0px)); max-height: 94vh; }
.sheet.wide .chips { gap: 6px; }
.sheet.wide .chip { min-height: 36px; padding: 4px 12px; font-size: 0.9rem; }
.sheet.wide .field { gap: 4px; }
.sheet.wide .head-sit { display: flex; align-items: flex-end; gap: 12px; }
.stat small { display: block; margin-top: 2px; font-size: 0.68rem; font-weight: 700; }
.stat.better { background: color-mix(in srgb, var(--good) 16%, var(--surface)); }
.stat.better b, .stat.better small { color: var(--good); }
.stat.worse { background: color-mix(in srgb, var(--bad) 16%, var(--surface)); }
.stat.worse b, .stat.worse small { color: var(--bad); }
th[aria-sort] button::after { content: ""; display: inline-block; margin-left: 5px; border-left: 4px solid transparent; border-right: 4px solid transparent; vertical-align: middle; }
th[aria-sort="descending"] button::after { border-top: 5px solid currentColor; }
th[aria-sort="ascending"] button::after { border-bottom: 5px solid currentColor; }
.duel { padding: 12px 18px; display: grid; gap: 10px; }
.duel-row { display: grid; grid-template-columns: minmax(70px, 28%) 1fr 48px; align-items: center; gap: 10px; }
.duel-row .nm { font-size: 0.8rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.duel-row .track { height: 14px; border-radius: 7px; background: var(--surface-2); overflow: hidden; }
.duel-row .fill { height: 100%; border-radius: 7px; background: var(--neutral); }
.duel-row.lead .fill { background: var(--accent); }
.duel-row .val { font-family: var(--display); font-weight: 800; font-size: 1.2rem; text-align: right; }
.legend.good { color: var(--good); font-weight: 700; }
.legend.bad { color: var(--bad); font-weight: 700; }
.bilan td.better { background: color-mix(in srgb, var(--good) 18%, var(--surface)); color: var(--good); font-weight: 700; }
.bilan td.worse { background: color-mix(in srgb, var(--bad) 18%, var(--surface)); color: var(--bad); font-weight: 700; }
.bilan th, .bilan td:not(.name) { text-align: center; }
.bilan tr.grp th { text-align: left; color: var(--accent); font-style: italic; letter-spacing: 0.12em; text-transform: uppercase; font-size: 0.75rem; background: var(--bg); }
</style>
</head>
<body>
<div class="shell">
  <nav class="side" id="side" aria-label="Navigation principale"></nav>
  <main class="main" id="app" aria-live="polite"></main>
  <nav class="tabbar" id="tabbar" aria-label="Navigation principale"></nav>
</div>
<div id="syncbar" class="syncbar" hidden role="status"></div>
<div id="toast" class="toast" hidden role="status"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
var state = { seasons: {}, players: {}, teams: {}, matches: {}, loaded: 0, admin: false, db: null, failed: false, slow: false };
var TEAM_NAME = "Gardons";
var COLLS = ["seasons", "players", "teams", "matches"];
var QUEUE_KEY = "gardons-write-queue";
var pending = [];
var flushing = false;
var syncFailed = false;
var retryTimer = null;
var pendingRender = false;
var toastTimer = null;

var ICON = {
  users: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6"/><circle cx="17.5" cy="9" r="2.5"/><path d="M17.5 14c2.4 0 4 1.7 4 4.5"/></svg>',
  home: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10l9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/></svg>',
  season: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>',
  history: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
  stats: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 20V10M12 20V4M6 20v-6"/></svg>',
  gear: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 0 1-4 0v-.1a1.7 1.7 0 0 0-1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 0 1 0-4h.1a1.7 1.7 0 0 0 1.5-1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3h0a1.7 1.7 0 0 0 1-1.5V3a2 2 0 0 1 4 0v.1a1.7 1.7 0 0 0 1 1.5h0a1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8v0a1.7 1.7 0 0 0 1.5 1H21a2 2 0 0 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>',
  back: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>',
  check: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"/></svg>'
};

function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
  });
}

function toast(msg) {
  var t = document.getElementById("toast");
  t.textContent = msg;
  t.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function () { t.hidden = true; }, 2600);
}

function list(map) {
  return Object.keys(map).map(function (id) { var o = Object.assign({}, map[id]); o.id = id; return o; });
}

function newId(coll) {
  return state.db.collection(coll).doc().id;
}

function loadQueue() {
  try { var raw = localStorage.getItem(QUEUE_KEY); var q = raw ? JSON.parse(raw) : []; return Array.isArray(q) ? q.map(function (p) { p.sending = false; return p; }) : []; } catch (e) { return []; }
}

function saveQueue() {
  try { localStorage.setItem(QUEUE_KEY, JSON.stringify(pending)); } catch (e) {}
}

function deepMerge(base, patch) {
  Object.keys(patch).forEach(function (k) {
    var v = patch[k];
    if (v && typeof v === "object" && !Array.isArray(v) && base[k] && typeof base[k] === "object" && !Array.isArray(base[k])) deepMerge(base[k], v);
    else base[k] = JSON.parse(JSON.stringify(v));
  });
  return base;
}

function enqueue(coll, id, data, mode) {
  var entry = { c: coll, id: id, mode: mode, data: mode === "delete" ? null : JSON.parse(JSON.stringify(data)) };
  var last = -1;
  pending.forEach(function (p, i) { if (p.c === coll && p.id === id && !p.sending) last = i; });
  if (last < 0 || pending[last].mode === "delete") pending.push(entry);
  else if (mode === "set" || mode === "delete") pending[last] = entry;
  else deepMerge(pending[last].data, entry.data);
  saveQueue();
}

function overlayPending(coll) {
  pending.forEach(function (p) {
    if (p.c !== coll) return;
    if (p.mode === "delete") delete state[coll][p.id];
    else if (p.mode === "set") state[coll][p.id] = JSON.parse(JSON.stringify(p.data));
    else if (state[coll][p.id]) deepMerge(state[coll][p.id], p.data);
  });
}

function sendEntry(p) {
  var ref = state.db.collection(p.c).doc(p.id);
  var op = p.mode === "delete" ? ref.delete() : p.mode === "set" ? ref.set(p.data) : ref.update(p.data);
  var timeout = new Promise(function (_, rej) { setTimeout(function () { rej({ code: "timeout" }); }, 8000); });
  return Promise.race([op, timeout]);
}

function renderSync() {
  var bar = document.getElementById("syncbar");
  if (!bar) return;
  if (!pending.length) { bar.hidden = true; return; }
  var n = pending.length;
  bar.textContent = (syncFailed ? "Hors ligne : " : "Envoi en cours : ") + n + " saisie" + (n > 1 ? "s" : "") + " en attente. " + (syncFailed ? "Gardez cette page ouverte, l'envoi reprend avec le réseau." : "");
  bar.className = "syncbar" + (syncFailed ? " off" : "");
  bar.hidden = false;
}

function flush() {
  if (flushing || !state.db || !pending.length) { renderSync(); return Promise.resolve(); }
  flushing = true;
  clearTimeout(retryTimer);
  var step = function () {
    if (!pending.length) {
      flushing = false;
      if (syncFailed) toast("Saisies envoyées");
      syncFailed = false; renderSync();
      return;
    }
    var p = pending[0];
    p.sending = true;
    return sendEntry(p).then(function () {
      pending.shift(); saveQueue();
      syncFailed = false; renderSync();
      return step();
    }).catch(function (e) {
      p.sending = false;
      flushing = false;
      if (e && (e.code === "invalid_argument" || e.code === "permission-denied")) {
        pending.shift(); saveQueue();
        toast("Action réservée à l'administrateur");
        return flush();
      }
      syncFailed = true; renderSync();
      retryTimer = setTimeout(flush, 5000);
    });
  };
  return step();
}

function write(coll, id, data, mode) {
  enqueue(coll, id, data, mode);
  renderSync();
  return flush();
}

window.addEventListener("online", function () { flush(); });

function fmtDate(iso, long) {
  if (!iso) return "";
  var p = iso.split("-");
  var d = new Date(+p[0], +p[1] - 1, +p[2]);
  if (isNaN(d)) return iso;
  return d.toLocaleDateString("fr-CA", long ? { weekday: "long", day: "numeric", month: "long", year: "numeric" } : { weekday: "short", day: "numeric", month: "short" });
}

function todayIso() {
  var d = new Date();
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
}

function activeSeason() {
  var s = list(state.seasons).filter(function (x) { return x.active; });
  return s[0] || null;
}

function teamName(id) { return state.teams[id] ? state.teams[id].name : "Équipe inconnue"; }
function playerName(id) { return state.players[id] ? state.players[id].name : "Joueur supprimé"; }

var LINES = ["1", "2", "3"];
var FOULS = ["Cinglage", "Faire trébucher", "Crosse haute", "Charge", "Obstruction", "Surnombre"];
var SHOT_KINDS = [{ k: "critical", label: "Critique", hint: "aurait pu être un but" }, { k: "normal", label: "Normal", hint: "cadré" }, { k: "missed", label: "Raté", hint: "non cadré" }];
var GOALIE_SHOTS = [{ k: "critical", label: "Arrêt critique", hint: "aurait pu être un but" }, { k: "normal", label: "Arrêt normal", hint: "tir cadré" }, { k: "missed", label: "Tir adverse raté", hint: "hors cadre, hors stats du gardien" }];
var SAVE_W = { critical: 2, normal: 1 };
var SITUATIONS = [{ k: "normal", label: "Jeu normal" }, { k: "sup", label: "Supériorité" }, { k: "inf", label: "Infériorité" }];
var PENALTIES = [{ k: "mineure", label: "Mineure", min: 2 }, { k: "double", label: "Double mineure", min: 4 }, { k: "majeure", label: "Majeure", min: 5 }, { k: "meconduite", label: "Méconduite", min: 10 }, { k: "match", label: "Match", min: 20 }];
var EVENT_LABEL = { goal: "But", assist: "Passe", penalty: "Pénalité", offside: "Hors-jeu", icing: "Dégagement interdit", save: "Arrêt", ga: "But encaissé", shot: "Tir", shotag: "Tir reçu" };

function evs(m) { return Array.isArray(m.events) ? m.events : []; }

function goalsFor(m) {
  return evs(m).filter(function (e) { return e.type === "goal"; }).length;
}

function goalsAgainst(m) {
  return evs(m).filter(function (e) { return e.type === "ga"; }).length;
}

function outcome(m) {
  if (!m.played) return "u";
  var f = goalsFor(m), a = goalsAgainst(m);
  return f > a ? "w" : f < a ? "l" : "n";
}

function record(matches) {
  var r = { w: 0, l: 0, n: 0, gf: 0, ga: 0, gp: 0 };
  matches.forEach(function (m) {
    if (!m.played) return;
    var o = outcome(m);
    r[o]++; r.gp++; r.gf += goalsFor(m); r.ga += goalsAgainst(m);
  });
  return r;
}

function playerMatchStats(m, pid, per) {
  var s = { g: 0, a: 0, pim: 0, hj: 0, di: 0, sv: 0, ga: 0, pen: 0, shc: 0, shn: 0, shm: 0, svc: 0, svn: 0, adm: 0 };
  evs(m).forEach(function (e) {
    if (per && String(e.per) !== String(per)) return;
    if (e.type === "goal" && Array.isArray(e.ast) && e.ast.indexOf(pid) >= 0) s.a++;
    if (e.pid !== pid) return;
    if (e.type === "goal") { s.g++; s.shc++; }
    else if (e.type === "assist") s.a++;
    else if (e.type === "penalty") { s.pim += e.min || 0; s.pen++; }
    else if (e.type === "offside") s.hj++;
    else if (e.type === "icing") s.di++;
    else if (e.type === "save") { s.sv++; s.svn++; }
    else if (e.type === "ga") s.ga++;
    else if (e.type === "shot") { if (e.kind === "critical") s.shc++; else if (e.kind === "normal") s.shn++; else if (e.kind === "missed") s.shm++; }
    else if (e.type === "shotag") { if (e.kind === "critical") { s.svc++; s.sv++; } else if (e.kind === "normal") { s.svn++; s.sv++; } else if (e.kind === "missed") s.adm++; }
  });
  s.sh = s.sv + s.ga;
  s.svw = s.svc * SAVE_W.critical + s.svn * SAVE_W.normal;
  return s;
}

function playerTotals(matches) {
  var out = {};
  matches.forEach(function (m) {
    if (!m.played) return;
    var ids = {}, pmv = matchPm(m);
    (m.lineup || []).forEach(function (pid) { ids[pid] = true; });
    evs(m).forEach(function (e) { if (e.pid) ids[e.pid] = true; });
    Object.keys(ids).forEach(function (pid) {
      var s = playerMatchStats(m, pid);
      var t = out[pid] || (out[pid] = { id: pid, gp: 0, g: 0, a: 0, pim: 0, hj: 0, di: 0, sh: 0, sv: 0, w: 0, shc: 0, shn: 0, shm: 0, svc: 0, svn: 0, svw: 0, adm: 0, pm: 0 });
      t.pm += pmv[pid] || 0; t.gp++; t.g += s.g; t.a += s.a; t.pim += s.pim; t.hj += s.hj; t.di += s.di; t.sh += s.sh; t.sv += s.sv; t.shc += s.shc; t.shn += s.shn; t.shm += s.shm; t.svc += s.svc; t.svn += s.svn; t.svw += s.svw; t.adm += s.adm;
      if (state.players[pid] && state.players[pid].pos === "G" && outcome(m) === "w") t.w++;
    });
  });
  return Object.keys(out).map(function (k) { out[k].pts = out[k].g + out[k].a; return out[k]; });
}

function sortedMatches(arr) {
  return arr.slice().sort(function (a, b) { return a.date < b.date ? 1 : a.date > b.date ? -1 : 0; });
}

function route() {
  var h = (location.hash || "").replace(/^#/, "") || "accueil";
  var m = h.match(/^(match|equipe|feuille|live)-([A-Za-z0-9_-]+)$/);
  if (m) return { name: m[1], id: m[2] };
  return { name: h };
}

function liveLockId() {
  if (!state.admin) return null;
  var ids = Object.keys(state.matches).filter(function (id) { var m = state.matches[id]; return m.live === true && !m.played; });
  return ids[0] || null;
}

function navHtml(current) {
  var lock = liveLockId();
  if (lock) {
    return [["feuille", "Match live", ICON.season], ["live", "Stats live", ICON.stats]].map(function (i) {
      return '<a class="tab" href="#' + i[0] + "-" + lock + '"' + (i[0] === current ? ' aria-current="page"' : "") + ">" + i[2] + "<span>" + i[1] + "</span></a>";
    }).join("");
  }
  var items = [
    ["accueil", "Accueil", ICON.home],
    ["saison", "Saison", ICON.season],
    ["effectif", "Effectif", ICON.users],
    ["historique", "Historique", ICON.history],
    ["stats", "Stats", ICON.stats]
  ];
  if (state.admin) items.push(["reglages", "Réglages", ICON.gear]);
  return items.map(function (i) {
    return '<a class="tab" href="#' + i[0] + '"' + (i[0] === current ? ' aria-current="page"' : "") + ">" + i[2] + "<span>" + i[1] + "</span></a>";
  }).join("");
}

function topbar(title, eyebrow) {
  return '<div class="topbar"><div><div class="eyebrow">' + esc(eyebrow || TEAM_NAME) + "</div><h1>" + esc(title) + '</h1></div><span class="role' + (state.admin ? "" : " guest") + '">' + (state.admin ? "Admin" : "Invité") + "</span></div>";
}

function backBar(href, label) {
  return '<div class="row"><a class="back" href="' + href + '" aria-label="Retour">' + ICON.back + '</a><span class="eyebrow">' + esc(label) + "</span></div>";
}

function emptyState(title, text, action) {
  return '<div class="card empty"><b>' + esc(title) + "</b>" + esc(text) + (action ? '<div style="margin-top:14px">' + action + "</div>" : "") + "</div>";
}

function matchRow(m) {
  var o = outcome(m);
  var score = o === "u" ? '<span class="pill">À venir</span>' : '<span class="score ' + o + '">' + goalsFor(m) + " - " + goalsAgainst(m) + "</span>";
  return '<a class="item" href="#match-' + m.id + '"><div class="grow"><div class="title">' + (m.home === false ? "@ " : "vs ") + esc(teamName(m.opponentId)) + '</div><div class="small muted">' + esc(fmtDate(m.date)) + "</div></div>" + score + "</a>";
}

function recordBar(r) {
  return '<div class="stats">' +
    '<div class="stat"><b class="num">' + r.w + "</b><span>Victoires</span></div>" +
    '<div class="stat"><b class="num">' + r.l + "</b><span>Défaites</span></div>" +
    '<div class="stat"><b class="num">' + r.n + "</b><span>Nuls</span></div>" +
    '<div class="stat"><b class="num">' + r.gf + "-" + r.ga + "</b><span>Buts P/C</span></div></div>";
}

var ui = { seasonSel: null, histSeason: null, statsSeason: "active", statsView: "players", statsTier: "all", sort: { players: { k: "pts", d: -1 }, goalies: { k: "pct", d: -1 }, mres: { k: "num", d: 1 } }, tf: { pos: "all", line: "all" } };

function seasonMatches(sid) {
  return list(state.matches).filter(function (m) { return m.seasonId === sid; });
}

function homeTop(s) {
  return '<div class="topbar"><div class="row" style="flex-wrap:nowrap;gap:14px"><img class="logo-sm" src="' + LOGO + '" alt="Gardons Rouen"><div><div class="eyebrow">' + esc(s ? "Saison " + s.name : TEAM_NAME) + "</div><h1>Accueil</h1></div></div>" +
    '<span class="role' + (state.admin ? "" : " guest") + '">' + (state.admin ? "Admin" : "Invité") + "</span></div>";
}

function viewHome() {
  var s = activeSeason();
  var all = list(state.matches);
  var upcoming = all.filter(function (m) { return !m.played; }).sort(function (a, b) { return a.date < b.date ? -1 : 1; })[0];
  var last = sortedMatches(all.filter(function (m) { return m.played; }))[0];
  var rec = s ? record(seasonMatches(s.id)) : { w: 0, l: 0, n: 0 };
  var hero = upcoming
    ? '<div class="hero"><div class="eyebrow">Prochain match</div><h1>' + (upcoming.home === false ? "@ " : "vs ") + esc(teamName(upcoming.opponentId)) + '</h1><div class="row between" style="margin-top:10px"><span>' + esc(fmtDate(upcoming.date, true)) + '</span><a class="btn primary" href="#match-' + upcoming.id + '">Ouvrir</a></div></div>'
    : '<div class="hero"><div class="eyebrow">Prochain match</div><h1>Aucun match prévu</h1><div class="row between" style="margin-top:10px"><span class="muted">' + (state.admin ? "Créez le prochain match en un geste." : "Revenez bientôt.") + "</span>" + (state.admin ? '<a class="btn primary" href="#reglages">+ Match</a>' : "") + "</div></div>";
  var lastTile = last
    ? '<a class="card" href="#match-' + last.id + '"><div class="eyebrow">Dernier match</div><div class="score ' + outcome(last) + '" style="font-size:2rem">' + goalsFor(last) + " - " + goalsAgainst(last) + '</div><div class="small muted">vs ' + esc(teamName(last.opponentId)) + "</div></a>"
    : '<div class="card"><div class="eyebrow">Dernier match</div><div class="muted">Aucun match joué</div></div>';
  var tiles = [["saison", "Saison en cours", ICON.season], ["historique", "Historique", ICON.history], ["stats", "Stats", ICON.stats]];
  if (state.admin) tiles.push(["reglages", "Réglages", ICON.gear]);
  return '<div class="stack">' + homeTop(s) + hero +
    '<div class="row" style="align-items:stretch"><a class="card grow" href="#saison"><div class="eyebrow">Bilan saison</div><div class="score" style="font-size:2rem">' + rec.w + "-" + rec.l + "-" + rec.n + '</div><div class="small muted">V-D-N</div></a><div class="grow" style="display:flex;flex-direction:column">' + lastTile.replace('class="card"', 'class="card" style="flex:1"').replace('class="card" href', 'class="card" style="flex:1" href') + "</div></div>" +
    '<h2>Accès rapide</h2><div class="stats" style="grid-template-columns:repeat(auto-fit,minmax(120px,1fr))">' +
    tiles.map(function (t) { return '<a class="stat" href="#' + t[0] + '" style="padding:18px 8px"><span style="display:block;color:var(--accent);margin-bottom:6px"><span style="display:inline-block;width:24px;height:24px">' + t[2] + "</span></span><span style=\"font-size:0.85rem;color:var(--ink);font-weight:700;text-transform:none;letter-spacing:0\">" + t[1] + "</span></a>"; }).join("") +
    "</div></div>";
}

function seasonViewId() {
  if (ui.seasonSel && state.seasons[ui.seasonSel]) return ui.seasonSel;
  var a = activeSeason();
  if (a) return a.id;
  var all = list(state.seasons).sort(function (x, y) { return x.name < y.name ? 1 : -1; });
  return all[0] ? all[0].id : null;
}

function viewSeason() {
  var seasons = list(state.seasons).sort(function (a, b) { return a.name < b.name ? 1 : -1; });
  var sid = seasonViewId();
  if (!sid) {
    return '<div class="stack">' + topbar("Saison") + emptyState("Aucune saison", state.admin ? "Créez une saison dans les réglages pour commencer à suivre vos matchs." : "L'administrateur n'a pas encore ouvert de saison.", state.admin ? '<a class="btn primary" href="#reglages">Ouvrir les réglages</a>' : "") + "</div>";
  }
  var s = state.seasons[sid];
  var ms = seasonMatches(sid);
  var upcoming = ms.filter(function (m) { return !m.played; }).sort(function (a, b) { return a.date < b.date ? -1 : a.date > b.date ? 1 : 0; });
  var done = sortedMatches(ms.filter(function (m) { return m.played; }));
  var picker = seasons.length > 1 ? '<div class="field"><label for="season-sel">Saison affichée</label><select class="input" id="season-sel" data-change="seasonSel">' + seasons.map(function (x) {
    return '<option value="' + x.id + '"' + (x.id === sid ? " selected" : "") + ">" + esc(x.name) + (x.active ? " (en cours)" : "") + "</option>";
  }).join("") + "</select></div>" : "";
  var upBody = upcoming.length ? '<div class="card flat list">' + upcoming.map(matchRow).join("") + "</div>"
    : emptyState("Aucun match à venir", state.admin ? "Préparez un match dans les réglages." : "Aucun match prévu pour l'instant.", state.admin ? '<a class="btn primary" href="#reglages">Préparer un match</a>' : "");
  var doneBody = done.length ? '<div class="card flat list">' + done.map(matchRow).join("") + "</div>"
    : emptyState("Aucun match terminé", "Les matchs terminés apparaissent ici.");
  return '<div class="stack">' + topbar(s.active ? "Saison en cours" : "Saison terminée", "Saison " + s.name) + picker + recordBar(record(ms)) +
    '<div class="row between"><h2>À venir</h2><a class="btn ghost" href="#stats">Voir le classement</a></div>' + upBody +
    "<h2>Terminés</h2>" + doneBody + "</div>";
}

function viewHistory() {

function sortTable(rows, cfg) {
  var k = cfg.k, d = cfg.d;
  return rows.slice().sort(function (a, b) {
    var x = a[k], y = b[k];
    if (typeof x === "string") return d * x.localeCompare(y);
    return d * ((x || 0) - (y || 0)) || (b.pts || 0) - (a.pts || 0);
  });
}

function th(view, key, label) {
  var cur = ui.sort[view];
  var on = cur.k === key;
  return "<th" + (on ? ' aria-sort="' + (cur.d < 0 ? "descending" : "ascending") + '"' : "") + '><button data-act="sort" data-view="' + view + '" data-key="' + key + '"' + ">" + label + "</button></th>";

  if (ui.tf.pos === "G") ui.tf.pos = "all";

      rows.map(function (r) { return '<tr><td class="name"><a href="#stats">' + esc(r.name) + '</a></td><td>' + r.gp + "</td><td>" + r.g + "</td><td>" + r.a + '</td><td class="pts">' + r.pts + "</td><td>" + (r.pm > 0 ? "+" : "") + r.pm + "</td><td>" + r.shc + "</td><td>" + r.shn + "</td><td>" + r.shm + "</td><td>" + fmt1(r.danger) + "</td><td>" + r.pim + "</td><td>" + r.hj + "</td><td>" + r.di + "</td></tr>"; }).join("") + "</tbody></table></div>"

ui.nm = null;
ui.confirmDel = null;
ui.sheet = null;
var POS = { A: "Attaquant", D: "Défenseur", G: "Gardien" };
var POS_ORDER = { D: 0, A: 1, G: 2 };

function byPosThenNum(a, b) {
  return (POS_ORDER[a.pos] - POS_ORDER[b.pos]) || ((a.num || 0) - (b.num || 0));
}

function initNewMatch() {
  var s = activeSeason();
  ui.nm = { seasonId: s ? s.id : null, opp: null, date: todayIso(), home: true, addTeam: false };
}

function compoGroups(lineup, lines) {
  var g = { lines: { "1": [], "2": [], "3": [] }, goalies: [], unassigned: [] };
  (lineup || []).forEach(function (pid) {
    var p = state.players[pid];
    if (!p) return;
    var o = Object.assign({ id: pid }, p);
    if (p.pos === "G") g.goalies.push(o);
    else if (lines && lines[pid] && g.lines[lines[pid]]) g.lines[lines[pid]].push(o);
    else g.unassigned.push(o);
  });
  Object.keys(g.lines).forEach(function (k) { g.lines[k].sort(byPosThenNum); });
  g.unassigned.sort(byPosThenNum);
  return g;
}

function compoSummary(lineup, lines) {
  var g = compoGroups(lineup, lines);
  var parts = LINES.map(function (l) { return '<span class="pill' + (g.lines[l].length ? " w" : "") + '">L' + l + " : " + g.lines[l].length + "</span>"; });
  parts.push('<span class="pill' + (g.goalies.length ? " w" : "") + '">G : ' + g.goalies.length + "</span>");
  if (g.unassigned.length) parts.push('<span class="pill l">À placer : ' + g.unassigned.length + "</span>");
  return '<div class="chips">' + parts.join("") + "</div>";
}

function gkRole(h, pid) { return h.gk && h.gk[pid] === "B" ? "B" : "T"; }

function roleOptions(p, inL) {
  if (p.pos === "G") return inL ? [["T", "Titulaire"], ["B", "Backup"], ["0", "OUT"]] : [["0", "OUT"], ["T", "Titulaire"], ["B", "Backup"]];
  if (!inL) return [["0", "OUT"]];
  var o = [["", "Rôle"]];
  if (p.pos === "A") o.push(["C", "Centre"]);
  o.push(["G", "Gauche"], ["D", "Droite"], ["0", "OUT"]);
  return o;
}

function compoEditor(target, h) {
  var lineup = h.lineup || [], lines = h.lines || {}, centers = h.centers || {}, sides = h.sides || {};
  var sid = target === "nm" ? (activeSeason() ? activeSeason().id : null) : (state.matches[target] ? state.matches[target].seasonId : null);
  var inRoster = {};
  rosterIds(sid).forEach(function (id) { inRoster[id] = true; });
  var shown = list(state.players).filter(function (p) { return inRoster[p.id] || lineup.indexOf(p.id) >= 0; }).sort(byPosThenNum);
  if (!shown.length) return emptyState("Aucun joueur", "L'effectif de cette saison est vide.", '<a class="btn dark" href="#effectif">Ouvrir l\'effectif</a>');
  var rows = shown.map(function (p) {
    var inL = lineup.indexOf(p.id) >= 0;
    var cur = lines[p.id] || "";
    var val = !inL ? "0" : p.pos === "G" ? gkRole(h, p.id) : (cur && centers[cur] === p.id) ? "C" : (sides[p.id] || "");
    var chips = p.pos === "G" ? "" : LINES.map(function (l) {
      return '<button class="chip sm" data-act="cl" data-t="' + target + '" data-p="' + p.id + '" data-l="' + l + '" aria-pressed="' + (inL && cur === l) + '" aria-label="Ligne ' + l + '">L' + l + "</button>";
    }).join("");
    var sel = '<select class="input sm" id="role-' + target + "-" + p.id + '" data-change="role" data-t="' + target + '" data-p="' + p.id + '"' + (!inL && p.pos !== "G" ? " disabled" : "") + ' aria-label="Rôle de ' + esc(p.name) + '">' +
      roleOptions(p, inL).map(function (o) { return '<option value="' + o[0] + '"' + (o[0] === val ? " selected" : "") + (o[0] === "" ? " disabled hidden" : "") + ">" + o[1] + "</option>"; }).join("") + "</select>";
    return '<div class="crow"><div class="row grow" style="flex-wrap:nowrap"><span class="jersey' + (inL ? "" : " off") + '">' + esc(p.num) + '</span><div class="grow"><div class="title"' + (inL ? "" : ' style="color:var(--muted)"') + ">" + esc(p.name) + '</div><div class="small muted">' + POS[p.pos] + '</div></div></div><div class="chips" style="align-items:center">' + chips + sel + "</div></div>";
  }).join("");
  return '<div class="card flat list">' + rows + "</div>";
}

function leaderCandidates(h) {
  return (h.lineup || []).map(function (pid) { return state.players[pid] ? Object.assign({ id: pid }, state.players[pid]) : null; })
    .filter(function (p) { return p && p.pos !== "G"; }).sort(function (a, b) { return (a.num || 0) - (b.num || 0); });
}

function leadersBox(target, h) {
  var cap = h.cap || {};
  var cands = leaderCandidates(h);
  var sel = function (key, label) {
    var cur = cap[key] || "";
    var taken = ["c", "a1", "a2"].filter(function (k) { return k !== key; }).map(function (k) { return cap[k] || ""; });
    return '<div class="field grow" style="min-width:150px"><label for="ld-' + target + "-" + key + '">' + label + '</label><select class="input" id="ld-' + target + "-" + key + '" data-change="leader" data-t="' + target + '" data-r="' + key + '"><option value="">Aucun</option>' +
      cands.map(function (p) { return '<option value="' + p.id + '"' + (cur === p.id ? " selected" : "") + (taken.indexOf(p.id) >= 0 ? " disabled" : "") + ">" + esc(p.num) + " " + esc(p.name) + "</option>"; }).join("") + "</select></div>";
  };
  return '<div class="row" style="align-items:flex-end;gap:12px">' + sel("c", "Capitaine") + sel("a1", "Assistant 1") + sel("a2", "Assistant 2") + "</div>";
}

function leadersReadOnly(h) {
  var cap = h.cap || {};
  var nm = function (k) { return cap[k] && state.players[cap[k]] ? state.players[cap[k]].name : ""; };
  if (!nm("c") && !nm("a1") && !nm("a2")) return "";

}

function matchPrepForm() {
  if (!ui.nm) initNewMatch();

    '<div class="small muted">La composition (lignes, capitaine, assistants) se prépare ensuite dans Saison, en ouvrant le match à venir.</div></div>';
}

function hhmm(t) {
  var d = new Date(t || 0);
  return String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0");
}

function shotLabel(k) {
  var f = SHOT_KINDS.filter(function (s) { return s.k === k; })[0];
  return f ? f.label : "";
}

function eventText(e) {
  var who = e.pid ? playerName(e.pid) : "Équipe";
  if (e.type === "shotag") return (GOALIE_SHOTS.filter(function (s) { return s.k === e.kind; })[0] || { label: "Tir reçu" }).label + " - " + who;
  var extra = e.type === "penalty" ? " " + (e.kind ? e.kind + ", " : "") + (e.min || 0) + " min" + (e.foul ? " (" + e.foul + ")" : "") : "";
  if (e.type === "shot" || e.type === "shotag") extra += " " + shotLabel(e.kind).toLowerCase();
  if ((e.type === "goal" || e.type === "ga") && (e.sit === "sup" || e.sit === "inf")) extra += " (" + (e.sit === "sup" ? "supériorité" : "infériorité") + ")";
  if (e.type === "ga" && Array.isArray(e.ice) && e.ice.length) extra += " [glace : " + e.ice.map(function (id) { return state.players[id] ? "n" + state.players[id].num : "?"; }).join(", ") + "]";
  if (e.type === "goal") {
    if (Array.isArray(e.ast) && e.ast.length) extra += " (passes : " + e.ast.map(playerName).join(", ") + ")";
    if (Array.isArray(e.ice) && e.ice.length) extra += " [glace : " + e.ice.map(function (id) { return state.players[id] ? "n" + state.players[id].num : "?"; }).join(", ") + "]";
  }
  return e.type === "goal" || e.type === "ga" ? EVENT_LABEL[e.type] + " - " + who + extra : EVENT_LABEL[e.type] + extra + " - " + who;
}

function feedHtml(m, mid, canDelete) {
  var list2 = evs(m).slice().reverse();
  if (!list2.length) return emptyState("Aucun événement", canDelete ? "Touchez un joueur pour enregistrer une action." : "Aucune action enregistrée pour ce match.");
  return '<div class="card flat list">' + list2.map(function (e) {
    return '<div class="item"><span class="small muted num">' + hhmm(e.t) + (e.per ? " T" + e.per : "") + '</span><span class="grow">' + esc(eventText(e)) + "</span>" +
      (canDelete ? '<button class="btn ghost danger" data-act="evdel" data-m="' + mid + '" data-e="' + esc(e.id) + '" aria-label="Annuler cet événement">Annuler</button>' : "") + "</div>";
  }).join("") + "</div>";
}

function linesReadOnly(m) {
  var g = compoGroups(m.lineup, m.lines);
  var blocks = [];
  LINES.forEach(function (l) {
    if (g.lines[l].length) blocks.push(["Ligne " + l, g.lines[l], m.centers && m.centers[l]]);
  });
  if (g.unassigned.length) blocks.push(["Sans ligne", g.unassigned]);
  if (g.goalies.length) blocks.push(["Gardien", g.goalies]);
  if (!blocks.length) return emptyState("Composition vide", "Aucun joueur convoqué pour ce match.");
  return '<div class="card flat list">' + blocks.map(function (b) {
    return '<div class="item" style="align-items:flex-start"><div class="eyebrow" style="min-width:84px;padding-top:4px">' + b[0] + '</div><div class="grow chips">' +
      b[1].map(function (p) { return '<span class="pill">' + esc(p.num) + " " + esc(p.name) + (b[2] === p.id ? " (centre)" : "") + (m.cap && m.cap.c === p.id ? " (capitaine)" : "") + (m.cap && (m.cap.a1 === p.id || m.cap.a2 === p.id) ? " (assistant)" : "") + "</span>"; }).join("") + "</div></div>";
  }).join("") + "</div>";
}

function resultTable(m) {
  var rows = matchRows(m);
  var inL = function (r) { return (m.lineup || []).indexOf(r.id) >= 0; };
  var sk = sortTable(applyRowFilters(rows.filter(function (r) { return !r.isG && (r.active || (inL(r) && m.lines && m.lines[r.id])); })), ui.sort.mres);
  var gk = ui.tf.line !== "all" ? [] : applyRowFilters(rows.filter(function (r) { return r.isG && (r.active || inL(r)); })).sort(function (a, b) { return (a.num || 0) - (b.num || 0); });
  if (!rows.some(function (r) { return r.active; })) return "";
  var out = "<h2>Résumé</h2>" + filterBar(true);
  if (!sk.length && !gk.length) out += emptyState("Aucun joueur", "Aucun joueur ne correspond au filtre.");
  if (sk.length) {
    out += '<div class="card flat tablewrap"><table><thead><tr>' + th("mres", "num", "Joueur") + th("mres", "g", "B") + th("mres", "a", "A") + th("mres", "pim", "Pun.") + th("mres", "hj", "HJ") + th("mres", "di", "DI") + th("mres", "shc", "TC") + th("mres", "shn", "TN") + th("mres", "shm", "TR") + th("mres", "pm", "+/-") + '</tr></thead><tbody>' +
      sk.map(function (r) { return '<tr><td class="name">' + esc(r.name) + "</td><td>" + r.g + "</td><td>" + r.a + "</td><td>" + r.pim + "</td><td>" + r.hj + "</td><td>" + r.di + "</td><td>" + r.shc + "</td><td>" + r.shn + "</td><td>" + r.shm + "</td><td>" + pmCell(r) + "</td></tr>"; }).join("") + "</tbody></table></div>";
  }
  if (gk.length) {
    out += '<div class="card flat list" style="margin-top:12px">' + gk.map(function (r) {
      return '<div class="item"><span class="title">' + esc(r.name) + '</span><span class="small muted num">' + r.sv + " arrêts / " + r.sh + " tirs" + (r.sh ? " - " + (r.sv / r.sh).toFixed(3).replace(/^0/, "") : "") + (r.g || r.a ? " - " + r.g + " B, " + r.a + " A" : "") + (r.svc || r.svn || r.adm ? " - arrêts crit. " + r.svc + ", norm. " + r.svn + ", tirs adverses ratés " + r.adm : "") + " - efficacité " + pmCell(r) + "</span></div>";
    }).join("") + "</div>";
  }
  return out;
}

function boardHtml(m) {

  var left = home ? TEAM_NAME : teamName(m.opponentId), right = home ? teamName(m.opponentId) : TEAM_NAME;
  return '<div class="card"><div class="eyebrow" style="text-align:center">' + esc(fmtDate(m.date, true)) + (sn ? " - " + esc(sn.name) : "") + '</div><div class="board" style="margin-top:10px"><div class="team">' + esc(left) + '</div><div class="big num">' + (home ? gf : ga) + " - " + (home ? ga : gf) + '</div><div class="team">' + esc(right) + '</div></div><div style="text-align:center;margin-top:8px"><span class="pill ' + (o === "w" ? "w" : o === "l" ? "l" : "") + '">' + label + "</span></div></div>";
}

function badgeList(m, p) {
  var s = playerMatchStats(m, p.id);
  var b = [];
  if (p.pos === "G") {
    if (s.sv) b.push('<span class="badge">Arr. ' + s.sv + "</span>");
    if (s.ga) b.push('<span class="badge bad">BE ' + s.ga + "</span>");
  } else {
    if (s.g) b.push('<span class="badge good">B ' + s.g + "</span>");
    if (s.a) b.push('<span class="badge">A ' + s.a + "</span>");
  }
  if (s.pim) b.push('<span class="badge bad">Pun. ' + s.pim + "</span>");
  if (s.hj) b.push('<span class="badge">HJ ' + s.hj + "</span>");
  if (s.di) b.push('<span class="badge">DI ' + s.di + "</span>");
  return b;
}

function sideOrder(arr, sides) {
  var left = arr.filter(function (p) { return sides[p.id] === "G"; });
  var right = arr.filter(function (p) { return sides[p.id] === "D"; });
  var none = arr.filter(function (p) { return sides[p.id] !== "G" && sides[p.id] !== "D"; });
  return { left: left, none: none, right: right };
}

function lineLayout(players, centerId, sides) {
  sides = sides || {};
  var byNum = function (a, b) { return (a.num || 0) - (b.num || 0); };
  var att = players.filter(function (p) { return p.pos === "A"; }).sort(byNum);
  var def = players.filter(function (p) { return p.pos === "D"; }).sort(byNum);
  var c = att.filter(function (p) { return p.id === centerId; })[0];
  var wings = att.filter(function (p) { return p.id !== centerId; });
  var o = sideOrder(wings, sides);
  var ordered = o.left.concat(o.none, o.right);
  if (c) ordered.splice(o.left.length + Math.floor(o.none.length / 2), 0, c);
  var d = sideOrder(def, sides);
  return { att: ordered, def: d.left.concat(d.none, d.right) };
}

function leaderTag(m, pid) {
  var cap = m.cap || {};
  if (cap.c === pid) return '<span class="lbadge" aria-label="Capitaine">C</span>';
  if (cap.a1 === pid || cap.a2 === pid) return '<span class="lbadge" aria-label="Assistant">A</span>';
  return "";
}

function pCard(m, mid, p, isC) {
  var b = badgeList(m, p);
  return '<button class="pcard' + (isC ? " center" : "") + '" data-act="pl" data-m="' + mid + '" data-p="' + p.id + '">' + (isC ? '<span class="cbadge" aria-label="Centre">CTR</span>' : "") + leaderTag(m, p.id) +
    '<span class="jersey">' + esc(p.num) + '</span><span class="title">' + esc(p.name) + "</span>" + (b.length ? '<span class="badges">' + b.join("") + "</span>" : "") + "</button>";
}

function lineBlock(m, mid, l, players) {
  var cid = m.centers && m.centers[l];
  var lay = lineLayout(players, cid, m.sides);
  var card = function (p) { return pCard(m, mid, p, p.id === cid); };
  var rows = "";
  if (lay.att.length) rows += '<div class="frow">' + lay.att.map(card).join("") + "</div>";
  if (lay.def.length) rows += '<div class="frow def">' + lay.def.map(card).join("") + "</div>";
  return '<div class="lineblock"><h2>Ligne ' + l + '</h2><div class="lrows">' + rows + "</div></div>";
}

function plButton(m, mid, p) {
  var s = playerMatchStats(m, p.id);
  var b = [];
  if (p.pos === "G") {
    if (s.sv) b.push('<span class="badge">Arr. ' + s.sv + "</span>");
    if (s.ga) b.push('<span class="badge bad">BE ' + s.ga + "</span>");
  } else {
    if (s.g) b.push('<span class="badge good">B ' + s.g + "</span>");
    if (s.a) b.push('<span class="badge">A ' + s.a + "</span>");
  }
  if (s.pim) b.push('<span class="badge bad">Pun. ' + s.pim + "</span>");
  if (s.hj) b.push('<span class="badge">HJ ' + s.hj + "</span>");
  if (s.di) b.push('<span class="badge">DI ' + s.di + "</span>");
  return '<button class="plbtn" data-act="pl" data-m="' + mid + '" data-p="' + p.id + '"><span class="jersey">' + esc(p.num) + '</span><span class="grow" style="text-align:left"><span class="title" style="display:block">' + esc(p.name) + '</span><span class="small muted">' + (p.pos === "G" ? "Gardien " + (m.gk && m.gk[p.id] === "B" ? "backup" : "titulaire") : POS[p.pos]) + '</span></span>' + (b.length ? '<span class="badges">' + b.join("") + "</span>" : "") + "</button>";
}

function onLines(m) {
  return (m.lineup || []).filter(function (id) {
    var p = state.players[id];
    return p && (p.pos === "G" || (m.lines && m.lines[id]));
  });
}

function endButton(m, id) {
  if (m.played) return '<button class="btn grow" data-act="played" data-m="' + id + '" data-v="0">Rouvrir le match</button>';
  var p = m.period || 1;
  if (p < 3) return '<button class="btn dark grow" data-act="period-next" data-m="' + id + '">Fin T' + p + "</button>";
  return '<button class="btn dark grow" data-act="played" data-m="' + id + '" data-v="1">Terminer le match</button>';
}

function viewSheetPage(id) {
  var m = state.matches[id];
  if (!m) return '<div class="stack">' + backBar("#saison", "Saison en cours") + emptyState("Match introuvable", "Ce match a été supprimé ou n'existe pas.") + "</div>";
  m = Object.assign({ id: id }, m);
  var g = compoGroups(m.lineup, m.lines);

    if (g.lines[l].length) sections += lineBlock(m, id, l, g.lines[l]);

  var locked = liveLockId() === id;
  return '<div class="stack live">' + (locked ? "" : backBar("#match-" + id, "Fiche du match")) + boardHtml(m) +
    '<div class="row" style="flex-wrap:nowrap">' + periodTag(m) + '<a class="btn grow" href="#live-' + id + '">' + (m.played ? "Résumé du match" : "Stats live") + '</a><button class="btn grow" data-act="ga" data-m="' + id + '">But contre</button>' +

function sheetHtml() {
  var sh = ui.sheet;

  var m = state.matches[sh.mid], p = state.players[sh.pid];
  if (!m || (!p && sh.step !== "ga")) return "";
  var head = '<div class="row between"><div class="row" style="flex-wrap:nowrap">' + (p ? '<span class="jersey">' + esc(p.num) + "</span><h3>" + esc(p.name) + "</h3>" : "<h3>But encaissé</h3>") + '</div><button class="btn ghost" data-act="sheet-close">Fermer</button></div>';
  var body;
  var evBtn = function (type, label, cls) { return '<button class="abtn ' + (cls || "") + '" data-act="ev" data-m="' + sh.mid + '" data-p="' + sh.pid + '" data-type="' + type + '">' + label + "</button>"; };
  var sitSel = function () {
    return '<div class="field"><label for="sit-sel">Situation</label><select class="input" id="sit-sel" data-change="sit">' + SITUATIONS.map(function (s) {
      return '<option value="' + s.k + '"' + ((sh.sit || "normal") === s.k ? " selected" : "") + ">" + s.label + "</option>";
    }).join("") + "</select></div>";
  };
  if (sh.step === "shot") {
    var against = p && p.pos === "G";
    body = '<div class="field"><span class="label">' + (against ? "Tir de l'adversaire" : "Tir") + '</span><div class="actions">' + (against ? GOALIE_SHOTS : SHOT_KINDS).map(function (s) {
      return '<button class="abtn' + (s.k === "critical" ? " good" : "") + '" data-act="shot-save" data-k="' + s.k + '">' + s.label + '<span class="small muted" style="display:block;font-weight:400">' + s.hint + "</span></button>";
    }).join("") + '</div></div><div class="row"><button class="btn grow" data-act="pen-back">Retour</button></div>';
  } else if (sh.step === "ga") {
    var gks = (m.lineup || []).filter(function (id) { return state.players[id] && state.players[id].pos === "G"; });
    var onIce = onLines(m).filter(function (id) { return state.players[id].pos !== "G"; }).map(function (id) { return Object.assign({ id: id }, state.players[id]); }).sort(byPosThenNum);
    var gkSel = gks.length > 1 ? '<div class="field"><span class="label">Gardien</span><div class="chips">' + gks.map(function (id) {
      return '<button class="chip" data-act="ga-goalie" data-v="' + id + '" aria-pressed="' + (sh.pid === id) + '">' + esc(state.players[id].num) + " " + esc(state.players[id].name) + (m.gk && m.gk[id] === "B" ? " (backup)" : "") + "</button>";
    }).join("") + "</div></div>" : "";
    body = sitSel() + gkSel + '<div class="field"><span class="label">But encaissé : joueurs sur la glace, hors gardien (' + sh.ice.length + '/5, facultatif)</span><div class="chips">' + (onIce.map(function (o) {
      return '<button class="chip" data-act="ga-ice" data-v="' + o.id + '" aria-pressed="' + (sh.ice.indexOf(o.id) >= 0) + '">' + esc(o.num) + " " + esc(o.name) + "</button>";
    }).join("") || '<span class="small muted">Aucun joueur dans la composition</span>') + '</div></div>' +
      '<div class="row"><button class="btn grow" data-act="sheet-close">Annuler</button><button class="btn primary grow" data-act="ga-save">Enregistrer le but encaissé</button></div>';
  } else if (sh.step === "goal") {
    var others = onLines(m).filter(function (id) { return id !== sh.pid; }).map(function (id) { return Object.assign({ id: id }, state.players[id]); }).sort(byPosThenNum);
    var lab = function (o) { return esc(o.num) + " " + esc(o.name); };
    var astChips = others.map(function (o) {
      return '<button class="chip" data-act="goal-ast" data-v="' + o.id + '" aria-pressed="' + (sh.ast.indexOf(o.id) >= 0) + '">' + lab(o) + "</button>";
    }).join("");
    var iceChips = others.filter(function (o) { return o.pos !== "G"; }).map(function (o) {
      return '<button class="chip" data-act="goal-ice" data-v="' + o.id + '" aria-pressed="' + (sh.ice.indexOf(o.id) >= 0) + '">' + lab(o) + "</button>";

      '<div class="row"><button class="btn grow" data-act="pen-back">Retour</button><button class="btn primary grow" data-act="goal-save">Enregistrer le but</button></div>';

      return '<button class="chip" data-act="pen-kind" data-v="' + n.k + '" aria-pressed="' + (sh.pen === n.k) + '">' + n.label + " - " + n.min + " min</button>";
    }).join("") + '</div></div><div class="field"><span class="label">Type</span><div class="chips">' + FOULS.map(function (f) {
      return '<button class="chip" data-act="pen-foul" data-v="' + esc(f) + '" aria-pressed="' + (sh.foul === f) + '">' + esc(f) + "</button>";
    }).join("") + '</div></div><div class="row"><button class="btn grow" data-act="pen-back">Retour</button><button class="btn primary grow" data-act="pen-save"' + (sh.pen && sh.foul ? "" : " disabled") + ">Enregistrer la pénalité</button></div>";
  } else if (p.pos === "G") {
    body = '<div class="actions"><button class="abtn" data-act="shot-open">Arrêt / tir reçu</button>' + '<button class="abtn bad" data-act="ga" data-m="' + sh.mid + '" data-p="' + sh.pid + '">But encaissé</button>' + '<button class="abtn good" data-act="goal-open">But</button><button class="abtn" data-act="pen-open">Pénalité</button></div>';
  } else {
    body = '<div class="actions">' + '<button class="abtn good" data-act="goal-open">But</button>' + '<button class="abtn" data-act="shot-open">Tir</button>' + '<button class="abtn bad" data-act="pen-open">Pénalité</button>' + evBtn("offside", "Hors-jeu") + evBtn("icing", "Dégagement interdit") + "</div>";
  }
  return '<div class="sheet-back" data-act="sheet-close"></div><div class="sheet' + (sh.step === "goal" || sh.step === "ga" ? " wide" : "") + '" role="dialog" aria-modal="true" aria-label="' + (p ? "Actions pour " + esc(p.name) : "But encaissé") + '">' + head + body + "</div>";

var SHOT_W = { critical: 2, normal: 1.5, missed: 1 };
var PERIODS = ["1", "2", "3"];
ui.liveTier = "all";

function emptyTier() {
  return { gs: 0, gf: 0, ga: 0, shc: 0, shn: 0, shm: 0, pim: 0, pen: 0, hj: 0, di: 0, ac: 0, an: 0, am: 0, svc: 0, svn: 0, sit: { normal: { f: 0, a: 0 }, sup: { f: 0, a: 0 }, inf: { f: 0, a: 0 } } };
}

function dangerOf(c, n, mi) { return c * SHOT_W.critical + n * SHOT_W.normal + mi * SHOT_W.missed; }
function fmt1(x) { return String(Math.round(x * 10) / 10).replace(".", ","); }
function pctOf(a, b) { return b ? Math.round(a / b * 100) + " %" : "-"; }

function liveStats(m) {
  var T = { all: emptyTier() };
  PERIODS.forEach(function (p) { T[p] = emptyTier(); });
  var sitOf = function (e) { return e.sit === "sup" || e.sit === "inf" ? e.sit : "normal"; };
  evs(m).forEach(function (e) {
    var per = e.per && T[String(e.per)] ? String(e.per) : null;
    var each = function (fn) { fn(T.all); if (per) fn(T[per]); };
    if (e.type === "goal") each(function (t) { t.gs++; t.gf++; t.shc++; t.sit[sitOf(e)].f++; });
    else if (e.type === "shot") {
      var k = e.kind === "critical" ? "shc" : e.kind === "normal" ? "shn" : e.kind === "missed" ? "shm" : null;
      if (k) each(function (t) { t[k]++; });
    } else if (e.type === "ga") each(function (t) { t.ga++; t.ac++; t.sit[sitOf(e)].a++; });
    else if (e.type === "shotag") {
      if (e.kind === "critical") each(function (t) { t.ac++; t.svc++; });
      else if (e.kind === "normal") each(function (t) { t.an++; t.svn++; });
      else if (e.kind === "missed") each(function (t) { t.am++; });
    } else if (e.type === "save") each(function (t) { t.an++; t.svn++; });
    else if (e.type === "penalty") each(function (t) { t.pim += e.min || 0; t.pen++; });
    else if (e.type === "offside") each(function (t) { t.hj++; });
    else if (e.type === "icing") each(function (t) { t.di++; });
  });
  return { T: T };
}

function sumLive(list) {
  var R = { T: { all: emptyTier() } };
  PERIODS.forEach(function (p) { R.T[p] = emptyTier(); });
  list.forEach(function (S) {
    Object.keys(R.T).forEach(function (k) {
      var a = R.T[k], b = S.T[k];
      ["gs", "gf", "ga", "shc", "shn", "shm", "pim", "pen", "hj", "di", "ac", "an", "am", "svc", "svn"].forEach(function (f) { a[f] += b[f]; });
      ["normal", "sup", "inf"].forEach(function (x) { a.sit[x].f += b.sit[x].f; a.sit[x].a += b.sit[x].a; });
    });
  });
  return R;
}

function tierMetrics(t) {
  var total = t.shc + t.shn + t.shm, cad = t.shc + t.shn, agT = t.ac + t.an + t.am, sv = t.svc + t.svn;
  return {
    gs: t.gs, total: total, cad: cad, danger: dangerOf(t.shc, t.shn, t.shm), prec: total ? cad / total * 100 : null, eff: cad ? t.gs / cad * 100 : null,
    gf: t.gf, ga: t.ga, diff: t.gf - t.ga,
    agT: agT, ac: t.ac, an: t.an, am: t.am, agD: dangerOf(t.ac, t.an, t.am),
    svc: t.svc, svn: t.svn, svw: t.svc * SAVE_W.critical + t.svn * SAVE_W.normal, svp: sv + t.ga ? sv / (sv + t.ga) * 100 : null,
    pen: t.pen, pim: t.pim, hj: t.hj, di: t.di
  };
}

function tierHasData(t) { return t.shc + t.shn + t.shm + t.ac + t.an + t.am + t.gf + t.ga + t.pen + t.hj + t.di > 0; }

function fmtVal(v, kind) {
  if (v == null) return "-";
  if (kind === "pct") return Math.round(v) + " %";
  if (kind === "dec") return fmt1(v);
  if (kind === "diff") return (v > 0 ? "+" : "") + v;
  return String(v);
}

function fmtDelta(d, kind) {
  var sign = d > 0 ? "+" : "-", a = Math.abs(d);
  if (kind === "pct") return sign + Math.round(a) + " pts";
  if (kind === "dec") return sign + fmt1(a);
  return sign + a;
}

function statGrid(specs, cur, prev, prevLabel) {
  return '<div class="stats">' + specs.map(function (sp) {
    var v = cur[sp.k], cls = "", delta = "";
    if (prev && sp.dir && v != null && prev[sp.k] != null) {
      var d = v - prev[sp.k];
      if (Math.abs(d) > 0.0001) {
        var good = sp.dir > 0 ? d > 0 : d < 0;
        cls = good ? " better" : " worse";
        delta = "<small>" + fmtDelta(d, sp.kind) + " vs " + prevLabel + "</small>";
      }
    }
    return '<div class="stat' + cls + '"><b>' + fmtVal(v, sp.kind) + "</b><span>" + sp.l + "</span>" + delta + "</div>";
  }).join("") + "</div>";
}

var TIER_GROUPS = [
  { title: "Attaque", specs: [{ l: "Buts", k: "gs", dir: 1 }, { l: "Tirs", k: "total", dir: 1 }, { l: "Cadrés", k: "cad", dir: 1 }, { l: "Danger", k: "danger", dir: 1, kind: "dec" }, { l: "Précision", k: "prec", dir: 1, kind: "pct" }, { l: "Efficacité", k: "eff", dir: 1, kind: "pct" }] },
